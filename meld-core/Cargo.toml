[package]
name = "meld-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for static WebAssembly component fusion"
readme = "README.md"
keywords = ["webassembly", "component-model", "fusion", "linking", "wasm"]
categories = ["wasm", "development-tools"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dependencies]
# WebAssembly parsing and encoding
wasmparser.workspace = true
wasm-encoder.workspace = true

# DWARF read/write for address remapping (#143 Phase 2 — DwarfHandling::Remap)
gimli.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
log.workspace = true

# Hashing (for attestation)
sha2.workspace = true
hex.workspace = true

# Serialization (for attestation)
serde.workspace = true
serde_json.workspace = true

# Optional: wsc-attestation integration
wsc-attestation = { version = "0.5", optional = true }
petgraph = "0.8.3"

[dev-dependencies]
proptest.workspace = true
wasmprinter.workspace = true
# Re-declared for integration tests (tests/dwarf_remap_witness.rs) to
# parse and validate the remapped DWARF in the fused output.
gimli.workspace = true
wat = "1.219"
wasmtime = "41.0.1"
wasmtime-wasi = "41.0.4"
bitflags.workspace = true  # Required for wit-bindgen component bindings
criterion.workspace = true
# SR-60 / #344: certificate-checked QF_BV SMT reference oracle for the
# extended-const FOLD (proves the #338 miscompile class closed by proof,
# not just examples). Default features only — pure Rust, wasm-clean, no
# external solver (z3/cadical stay behind non-default features).
ordeal = { version = "0.18", default-features = false }

[features]
default = []
# Enable wsc-attestation integration for supply chain tracking
attestation = ["wsc-attestation"]

[[bench]]
name = "fusion_benchmarks"
harness = false
