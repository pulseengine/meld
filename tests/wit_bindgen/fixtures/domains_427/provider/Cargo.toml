[workspace]
[package]
name = "capfix-provider"
version = "0.1.0"
edition = "2021"
description = "meld#427 fixture: a capability provider whose interface carries a RESOURCE handle (gale#408)."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.52", default-features = false, features = ["macros"] }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
