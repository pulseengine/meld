[package]
name = "meld-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for static WebAssembly component fusion"
readme = "../README.md"
keywords = ["webassembly", "component-model", "fusion", "cli"]
categories = ["wasm", "command-line-utilities"]

[[bin]]
name = "meld"
path = "src/main.rs"

[dependencies]
# `version` alongside `path`: cargo uses the path locally and the version when
# published. Without it this is a wildcard dependency, which crates.io rejects
# outright — so the crate could never be published (#442). cargo-deny caught it
# before `cargo publish --dry-run` would have.
meld-core = { path = "../meld-core", version = "0.60.0" }

# CLI
clap.workspace = true

# Error handling
anyhow.workspace = true

# Logging
log.workspace = true
env_logger.workspace = true

# Serialization (for attestation output)
serde_json.workspace = true

# WASM validation
wasmparser.workspace = true

[dev-dependencies]
# For testing with WAT files
wasmprinter.workspace = true
# For building test modules
wasm-encoder.workspace = true
