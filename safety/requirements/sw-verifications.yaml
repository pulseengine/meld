  - id: SWV-98
    type: sw-verification
    title: "Verification of SR-86: a grouping decides which calls keep the Canonical ABI"
    status: implemented
    description: "Verifies SR-86 on gale's handle-carrying fixture extended with a second tenant (tests/wit_bindgen/fixtures/domains_427; provider and consumer are gale's from gale#412, consumer2 is consumer renamed). Two callers of one provider is what makes the property observable: the only difference between the two call sites is which domain they land in, so an identical call's lowering is a function of the grouping alone. Eight tests. The central one asserts that with consumer grouped with provider and consumer2 outside, consumer's four boundaries are direct and not crossing memory while consumer2's four are memory-copy and crossing — same interface, same generated call sites. A second asserts every boundary's recorded domains agree with its crossing, so the record and the lowering cannot disagree. A third asserts one memory per domain, measured by counting the memory section: one domain gives one memory, two give two, three give three. Measured end to end through the CLI on the same fixture: 4 direct with inlined-direct wiring and 4 memory-copy with thunk wiring, two memories, output validates — the shape that was previously unreachable, since one global --memory gave either 8 memory-copy across 3 memories or 8 direct in 1. Safety properties verified as refusals rather than behaviour: a grouping that does not partition the inputs is refused (a component in no domain, a component in two, a component index that does not exist), a grouping under --memory multi is refused rather than silently doing nothing, and --component output with domains is refused because the component wrapper names one memory in its lift options and would hand every export the first domain's memory. Two no-op properties bound the blast radius: with the attestation off, an explicit single domain covering every input produces byte-identical output to no grouping at all, and with it on the two differ, because a caller who stated the grouping said something a caller who stayed silent did not. Not covered: handle-table forgeability between two components sharing a domain is argued from the allocation code (HandleTableInfo carries memory_idx and table_base_addr, so a table is a region in linear memory reached through memory_index_map) and is not observed here, because handle tables are allocated only for re-exporter components and this fixture has none. Gate: fmt 0, clippy 0, test --workspace 0 (914 passed, 11 ignored), test --workspace --all-features 0 (913 passed, 11 ignored)."
    links:
      - type: verifies
        target: SR-86

  - id: SWV-99
    type: sw-verification
    title: "Verification of SR-87: an unassessed advisory fails the release"
    status: implemented
    description: "Verifies SR-87 by exercising the property that makes the document worth signing: the generator refuses to assert safety nobody assessed. Four controls, each observed to fail or pass as stated. (1) Against the real shipped SBOM for v0.59.0 the generator writes a valid CycloneDX 1.5 VEX: 0 in-scope judgements, 26 advisories out of scope, 60 shipped components, linked to the SBOM's serialNumber. (2) Given an SBOM that does list wasmtime, nineteen advisories become in-scope with no judgement and the generator exits 1 naming each — it does not omit them and does not default not_affected. (3) Given one in-scope advisory with an invalid justification string the generator exits 1 citing the justification specifically; isolated with a single-component SBOM so the unjudged check could not be the cause, and paired with (4) the same entry carrying a valid CycloneDX justification, which exits 0 — so control (3) is known to have failed for the justification reason rather than for absence. (5) An SBOM with an empty component list exits 1 rather than declaring every advisory out of scope and emitting a vacuously clean document. Placement verified in the workflow step order: SBOM, then VEX, then SHA256SUMS, then cosign — so the VEX digest enters the signed checksum manifest. The assets gate now requires both .cdx.json and .vex.json; the SBOM had shipped since v0.53.0 without ever being required, so it could have gone missing silently. Separately, deny.toml scopes the advisory check to the shipped graph via exclude-dev, with the three verifications that establish wasmtime is dev-only recorded in the file (cargo tree --edges normal gives 0 for both crates, and the shipped release binary contains 0 wasmtime or cranelift strings), and it carries no ignore entries: the one shipped-graph advisory found when the gate was added was fixed, not ignored. cargo deny check passes all four of advisories, licenses, bans and sources with zero exceptions — bans only after fixing a real defect it found, meld-cli depending on meld-core by path with no version requirement, which crates.io rejects outright and which would have blocked the publish in #442."
    links:
