  - id: SWV-103
    type: sw-verification
    title: "Verification of SR-91: the traceability ratchet fails on an added diagnostic and passes on a clean tree"
    status: verified
    description: "Verifies SR-91 by exercising the gate at both polarities before it landed, rather than by observing it pass on the tree it was written against. Measured, with rivets own exit code captured directly rather than through a pipeline: on an unmodified tree `rivet validate --new-since origin/main --fail-on info` reports \"New diagnostics since origin/main: 0\" and exits 0. With a deliberately unlinked sw-req added (SR-999, no backlink, no derives-from) it reports 4 new diagnostics -- 1 error, 1 warning, 2 infos, naming cardinality, swe1-derives-from-sys, swe1-has-verification and orphan-artifact -- and exits 1 at both `--fail-on info` and `--fail-on warning`, while `--fail-on error` exits 0. That last number is why the threshold is `info` and not `warning`: the rule previously claimed to be enforced, swe1-has-verification, is Info severity, so a warning threshold would have left that claim false. The 111 pre-existing diagnostics stay out of the result in every case, which is what makes the gate a ratchet rather than a backlog demand. Independently of the synthetic control, the gate caught a REAL omission on its first use against actual work: run against the stackless-provider branch it reported exactly 2 new warnings, both `prose-mention-without-typed-link`, on a requirement that amended an earlier one's precondition with no typed link to it, so a reader tracing from that earlier requirement would not have found the one that changed its contract. Adding the two missing `refines` links returned the gate to 0 new diagnostics and exit 0. A checker that finds its authors mistake before anyone elses is the evidence wanted here. The exit-code mapping is itself part of the gate: 0 passes with a notice, 1 fails naming what to do, and any other code fails as UNKNOWN coverage rather than being treated as a pass. Not established: that the pre-existing backlog is clean, or that every sw-req carries a backlink. Neither is claimed, and the parent requirement's acceptance stays unmet -- see the issues tracked for requirement coverage. UPDATE 2026-10-14: status implemented -> verified for v0.62.0. Since landing, the ratchet has run on every pull request and passed on #470, #471 and #468, including #468's merge of two branches that appended to the same traceability files, and #470 made it print the diagnostics it fails on. Set with `rivet modify`, deliberately not with `rivet verify`, which promotes on link presence alone."
