he runtime PoC and a structural test asserting the global and a body call of the same import name the same fused function; with the refresh disabled the PoC fails with 3000 against 3090 and the structural test fails, and the control passes. Re-run gate: fmt 0; clippy 0 with and without --all-features; cargo test --workspace exit 0 with 940 passed and 0 failed; --all-features exit 0 with 939 passed and 0 failed; corpus byte-identical. UPDATE 2026-10-15: status implemented -> verified for v0.63.0. The tests recorded above passed in the required CI of #487, run on a tree merged with main, and every Tier-5 change passed a fresh Mythos delta-pass whose findings were fixed before merge. Set with `rivet modify`, deliberately not with `rivet verify`, which promotes on link presence alone."
