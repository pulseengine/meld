        target: SR-87

  - id: SWV-100
    type: sw-verification
    title: "Verification of SR-88: the proof gate fails when it selects nothing"
    status: verified
    description: "Verifies SR-88 by exercising the failure paths rather than asserting them, because the defect being closed is a check that reports success while checking nothing. The gate step was extracted from .github/workflows/proofs.yml and run against a stub bazel at each exit code: 0 passes with a notice naming the 14 targets; 4 fails with exit 4 and an annotation stating that the suite selected zero tests and therefore proved nothing; 3 and 1 propagate unchanged with an annotation distinguishing a broken proof from an empty selection, because the two need different fixes. No tolerance for exit 4 is present anywhere in the step — synth hit exactly that with an || [ 0 -eq 4 ] and documents it (synth#945). The census step enforces floors rather than only printing counts, since a printed number nobody reads is not a gate: 28 .v files, 350 Qed, 14 rocq_proof_test targets, 14 members in //proofs:verify_all, and zero Admitted. Three controls, each observed to fail with its own distinct message: dropping one member from the test_suite reports 13 members against the floor of 14; injecting an Admitted reports the count and names proofs/parser/parser.v:11; deleting two spec files reports 26 files against 28 and 288 Qed against 350. The census itself was found broken by running it against a healthy tree, where it exited 1: grep -c exits 1 when a file has zero matches and find -exec + propagates that, so under set -e -o pipefail the step aborted after assigning — and the Admitted counter hit it immediately because no file contains one. All four counters are now guarded. Not established: whether the proofs compile. They have never been built in CI and this machine has neither nix nor bazel, so the first run of the workflow is the first time anyone finds out; a red first run is the finding rather than a regression introduced by this change. UPDATE 2026-10-07: status implemented -> verified. The one thing this verification said it could not establish — whether the proofs compile — is now observed. Run 37569422631 reported `Executed 16 out of 16 tests: 16 tests pass` with 108 build actions, and the census printed 28 files / 14640 lines / 357 Qed / 0 Admitted / 16 targets / 16 members against its floors. The first run was red, as this verification predicted it might be, and the finding was six non-compiling .v files including a lemma that was false as stated; all are fixed in 289c4a6."
    links:
      - type: verifies
        target: SR-88

  - id: SWV-101
    type: sw-verification
    title: "Verification of SR-89: the coverage check discriminates in both directions"
    status: verified
    description: "Verifies SR-89 by running the coverage comparison against synthetic file lists at both polarities, rather than by observing it pass on a tree that was fixed in the same commit -- a check committed alongside its own fix reports green and thereby demonstrates nothing. The step logic was extracted verbatim (bazel query stubbed by a labels file) and exercised in five cases, each observed: (A) the pre-fix lists, where it names exactly proofs/spec/alias_spec.v, proofs/spec/p1_adapter_spec.v and proofs/spec/wasm_core_generated.v and exits 1 -- the prediction recorded in the commit message before the run; (B) the post-fix lists, with two files wired into the suite and one excluded, where it prints CLEAN and exits 0; (C) an empty query result, where it fails its own positive control with POTENCY-CONTROL-FAILED rather than misreporting all five files as orphans, so a broken query mechanism cannot read as a finding about the tree; (D) a file both present in the closure and listed in gate-exclusions.txt, which stays CLEAN, confirming an exclusion does not double-count; (E) a newly introduced orphan alongside an already-excluded file, where it names only the new one -- the case the step exists for. The harness itself was found faulty by this procedure before the step was trusted: the first run reported every case dirty, including case B which should have been clean, because zsh does not word-split an unquoted parameter and the fixture collapsed to a single line. That mismatch is the only reason it was caught; had case B been the only case run, a harness producing one-line input would have looked like a working check. Two of the three files SR-89 concerns were then repaired and admitted to the suite: p1_adapter_spec.v failed with Incorrect number of goals (expected 4 tactics) because destruct mem; [t|]; simpl; destruct realloc; [t|] supplies two branches while Ltac applies the second destruct to both goals of the first, giving four; handled uniformly, statement unchanged, coqc exit=0 under Rocq 9.0.1. alias_spec.v already compiled. The floors in //proofs:verify_all move 14 -> 16 to match. Not established: that the full suite passes in CI. That is SR-88 and is blocked on #450. UPDATE 2026-10-07: status implemented -> verified. The unit-level evidence is now joined by the integrated observation this artefact said was missing: run 37569422631 printed `gate coverage: 27 of 28 .v files are built by //proofs:verify_all (1 excluded by proofs/gate-exclusions.txt)`, so the step ran against real `bazel query` output and reported the true figure rather than a stub's."
