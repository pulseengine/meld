  - id: SWV-96
    type: sw-verification
    title: "Verification of SR-84: musl assets are built and required"
    status: implemented
    description: "Verifies SR-84 at four levels, because a claim about running on a system without glibc is not the same claim as one about compiling for it. (1) Execution on a glibc-free system, which is the requirement's own claim rather than a proxy for it: the release pipeline runs the built x86_64 musl binary inside alpine:3.20 and requires it to identify itself. The v0.58.3 run recorded 'x86_64-unknown-linux-musl: ran on alpine (no glibc) -> meld 0.58.3'. (2) Execution elsewhere: the same step runs each asset whose architecture matches its runner, which covers aarch64-apple-darwin, x86_64-unknown-linux-gnu and x86_64-unknown-linux-musl; three of the six targets. (3) Linkage, for the assets no runner can execute: readelf reads foreign architectures, so the cross-built aarch64 musl asset is still required to carry no interpreter. Measured on the published v0.58.3 archives, the two musl assets are NOT the same ELF shape — x86_64 is a static-PIE (ET_DYN, a PT_DYNAMIC segment for self-relocation, DT_NEEDED = 0) and aarch64 is a plain ET_EXEC with no dynamic segment at all. Both carry no interpreter, require no shared library and export no GLIBC_* symbol version. An earlier revision of this description said the binaries have 'no PT_DYNAMIC': that was measured on binaries linked locally with zig during development and is false of what the pipeline ships, so the verifying property is the absence of an interpreter and of DT_NEEDED entries, never the absence of a dynamic segment. The shipped gnu asset is the discriminator that shows the reading is not vacuous: ET_DYN with interpreter ld-linux-x86-64.so.2, DT_NEEDED = 2, and GLIBC symbol versions up to GLIBC_2.34. (4) Presence: release-assets-gate.yml requires both musl triples among the published assets, shown potent in both directions — dispatched against v0.58.2, which carries no musl assets, the old gate passed and the updated one failed naming both missing archives; on v0.58.3 it passed naming both present. Guards against a check that passes by absence: the linkage step demands readelf, treats a non-zero readelf and empty output as fatal, and requires the binary to exist, because 'readelf | grep -q' is false when readelf never produced output — an earlier revision of that step reported 'statically linked' for a file that did not exist. Separately, tools/check_release_targets.py holds the build matrix and the gate's required list in agreement on the pull request, since the gate itself only runs after publication."
    fields:
      method: automated-test
    links:
      - type: verifies
        target: SR-84

  - id: SWV-97
    type: sw-verification
    title: "Verification of SR-85: a missing fixture fails the suite"
    status: implemented
    description: "Verifies SR-85 empirically rather than by inspection, by running the suite in the state CI sees. Before: with the untracked fixtures removed, cargo test --workspace reported 914 passed, 0 failed and exited 0, while 36 tests across 11 binaries announced a skip and executed nothing; the announcements are invisible in CI because cargo captures stdout for passing tests, so the only trace was a 0.00s duration beside ok. After: the same removal exits 101. Thirty-four fixtures are now tracked — 11 components under release-0.2.0 that .gitignore's *.wasm rule hid, 22 outputs under four compose* directories whose .wat sources and build.sh are tracked but which no workflow runs, and resource_floats_opaque.wasm at the top level — and the 50 guards that returned early on absence now fail instead. The last of those was found by CI rather than by the author: the glob used to verify the others, fixtures/**/*.wasm, requires a subdirectory and so skipped top-level files, which is the same class of mistake as the defect being fixed; the converted guard turned it into a red build, which is the mechanism working on its own author. Two sets cannot be satisfied from the repository and are marked ignored with a reason rather than left reporting success: three reloc tests read /tmp/spike326, scratch from the #326 investigation that exists on no machine, and five osxcar tests read third-party binaries that tests/osxcar/download.sh fetches from osxcar.de. golden_e2e's corpus assertion was 'ran > 0', which the nine fixtures its own source calls a run-ok signal satisfied while the three it calls the strong differential were absent; it now requires the whole corpus. Recurrence is closed by the change itself rather than by a separate checker: a fixture a test reads but nobody commits now fails CI. A checker asserting that every fixture is tracked would be vacuous in CI, where everything present is tracked by definition. Gate: fmt 0, clippy 0, test --workspace 0 (906 passed, 11 ignored), test --workspace --all-features 0 (905 passed, 11 ignored). Main CI green on the merge commit a76aea3."
