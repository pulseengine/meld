fore this change (#467). All 49 outputs validate. Local gate: fmt 0; clippy 0 with and without --all-features; cargo test --workspace exit 0 with 934 passed and 0 failed; --all-features exit 0 with 933 passed and 0 failed. UPDATE 2026-10-14: the Mythos delta-pass on this change found that treating an import unmapped at merge time as permanently unmapped refused valid inputs: under --memory multi or auto the resolver promotes an intra-component call between two memory-carrying modules to an AdapterSite and removes its module resolution, which also removed the merge-order edge, so an importer defined before its provider was merged first and its call became UnmappedFunctionImport, where main re-rewired it and returned the right value. Fixed: compute_module_merge_order now takes an edge from every intra-component AdapterSite (provider before importer), and an import whose provider is merged later only because of a cycle is recorded as pending and keeps the placeholder-then-rewire path; a pending import named by an elem slot is refused, since element segments are not re-indexed after wiring. The same ordering fixes a pre-existing defect on main, where such an import in an elem slot kept the identity index. meld-core/tests/intra_adapter_merge_order_462.rs runs three components under wasmtime -- provider-first (control), importer-first call, importer-first elem -- each expecting 42. Potency: reverting the edges makes the elem test fail on the new refusal; reverting the edges and the pending handling makes the call test fail with UnmappedFunctionImport, as the delta-pass reported; the control passes throughout. Unit tests check provider-first ordering, a no-site control and a cyclic pair. A Kani harness for the ordering did not complete within 580 s and was not committed. Corpus: the ordering change adds no output differences beyond the 26 already explained; all 49 outputs validate; cpetig's runtime result is unchanged. Re-run gate: fmt 0; clippy 0 with and without --all-features; cargo test --workspace exit 0 with 941 passed and 0 failed; --all-features exit 0 with 940 passed and 0 failed. UPDATE 2026-10-15: status implemented -> verified for v0.63.0. The tests recorded above passed in the required CI of #477, run on a tree merged with main, and every Tier-5 change passed a fresh Mythos delta-pass whose findings were fixed before merge. Set with `rivet modify`, deliberately not with `rivet verify`, which promotes on link presence alone."
