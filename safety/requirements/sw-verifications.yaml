  - id: SWV-93
    type: sw-verification
    title: "Verification of SR-81: an export that needs an allocator can reach one"
    status: implemented
    description: "Verifies SR-81 via meld-core/tests/allocator_reachable_81.rs (2 tests) on in-repo fixtures, covering the two independent ways a fused export was left uninvocable. a_needed_allocator_is_not_pruned fuses the wide provider alone with shared memory and address rebasing and requires an allocator export to survive; no manifest is involved, because the export is uninvocable either way. every_export_that_needs_an_allocator_can_call_one fuses two wide providers in shared memory — where only one component can hold the name cabi_realloc — requires both manifest entries to name a distinct, exported function with the allocator signature, and then CALLS through the one whose export exists only because SR-81 added it: allocate the argument area, write 18 floats into the named memory, invoke, and read sum(1..=14) = 105 out of the return area the manifest describes. Negative controls, each failing exactly one test and leaving the other green: reverting the #298 predicate fix drops the allocator and fails the first (\"this module exports none\"); disabling the added allocator exports fails the second (\"needs an allocator and the manifest names none\"). An earlier control for this work PASSED for the wrong reason — the fixture path already exported the allocator, so the test could not fail — which is why both controls here were run and observed to fail before the tests were trusted."
    fields:
      method: automated-test
    links:
