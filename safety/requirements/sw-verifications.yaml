    status: verified
    description: "Verifies SR-99 in meld-core/tests/lower_memory_484.rs. Fixtures build a component with several memory-owning core modules, lower a host import with one specific module's memory, fuse with --memory multi and component output 20 times in one process with attestation off, and run each under wasmtime with a host function that records what it receives. Each test asserts exactly one distinct output and that every run delivers the unfused component's value (\"hello\"), across six module orders; further fixtures cover a source realloc and a UTF-16 source lower. Potency, measured against unmodified main: the memory fixture delivered the wrong bytes in 8 of 20 runs, the realloc fixture diverged in 7 of 20, the UTF-16 fixture diverged in 20 of 20, and the unfused sanity test passed; on the branch all four pass. Corpus: all 49 wit-bindgen fixtures with --memory multi --component --no-attestation are byte-identical before and after. Local gate: fmt 0; clippy 0 with and without --all-features; cargo test --workspace exit 0 with 939 passed and 0 failed; --all-features exit 0 with 938 passed and 0 failed. Not covered by a dedicated test: two lowers of one fused import that disagree (the error path), and a realloc in a module whose memory is not exported. UPDATE 2026-10-15: the Mythos delta-pass on #490 found the disagreement check could be skipped: a lower reached through an alias re-export was not traced, and the dedup path merged such an import into a fused import without recording its site, so a fused import shared with a lower naming another memory delivered the wrong module's bytes in 20 of 20 runs (main: wrong at random). Fixed by tracing lowers through any chain of instance exports and core aliases, and by refusing, with an error naming the import, any untraced import that shares a fused import with another; a lone untraced import keeps the per-component default. Lower slots are now created with entry().or_insert, so a type-mismatched import cannot redirect