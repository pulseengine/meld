  - id: SWV-44
    type: sw-verification
    title: "Verification of SR-44: Enforced requirement->verification traceability"
    description: "CORRECTED 2026-10-07 (#412). The previous text claimed that `rivet validate` mechanically enforces the sw-req to sw-verification backlink and that \"the passing gate is itself the verification measure\". None of that held. No workflow ran `rivet validate` at all: release-readiness.yml runs `rivet release status`, a different command, and compliance.yml is a post-publish report generator triggered on `release: published`. So there was no passing gate to be the measure. It would also not have failed had it run -- deleting an SWV block leaves a WARNING and exit 0, and the specific rule named here, `swe1-has-verification`, is INFO severity, while `--fail-on` existed and was used nowhere. This requirement's acceptance also required every SR linked by `verifies`, which stood at 5 of 89. What IS verified now, by .github/workflows/traceability.yml, under the requirement that introduced it: `rivet validate --new-since origin/<base> --fail-on info` runs on every pull request and fails when the change ADDS any diagnostic at info severity or above. That is a ratchet rather than an absolute: the tree carries 111 pre-existing warnings, and a gate set to zero would be red from its first run, which is how a gate gets disabled and stops guarding anything. Potency measured rather than asserted -- adding an sw-req with no backlink gives exit 1 at both info and warning, a clean tree gives exit 0, and on its first real use it caught an omission in the very change that introduced it (a requirement citing the two it refines in prose, with no typed link). NOT established, and deliberately so: that every sw-req carries a backlink today. The ratchet prevents new gaps; it does not clear the backlog, and acceptance remains unmet until requirement-coverage is driven up. Tracked in #412 and #410."
    status: implemented
    fields:
      method: static-analysis
    links:
      - type: verifies
        target: SR-44
