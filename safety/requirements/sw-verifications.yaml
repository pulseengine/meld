        target: SR-81

  - id: SWV-94
    type: sw-verification
    title: "Verification of SR-82: shipped source strings are scanned too"
    status: implemented
    description: "Verifies SR-82 via meld-cli/src/main.rs auto_memory_claim_tests::no_shipped_source_string_claims_auto_selects_shared, which scans the crate's own source with #[cfg(test)] modules stripped line-wise — a brace counter is fooled by the `'{'` char literals in the stripper itself and silently under-strips, which is why the strip is line-based. Guarded against a vacuous pass: the stripped text must exceed 1000 bytes. It found two claims the three existing tests could not see, both shipped in v0.56.1 through v0.58.0: the --memory multi warning ('picks a single-memory form when sound') and a dead print arm ('single-memory output'). The checker needed two widenings, each exposed by a control that PASSED when it should have failed: SUBJECT now matches single-memory/one-memory phrasings, since neither claim used the word 'shared'; ATTRIBUTION matches a verbless label such as '(auto: ...)', which the sentence split on '.' had also fragmented. Both phrasings joined the verbatim fixture list. Negative control: restoring the old warning text fails this test alone, naming the exact sentence."
