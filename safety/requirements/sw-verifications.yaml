    status: verified
    description: "Verifies SR-107. meld-core/tests/byte_pages_530.rs fuses the domains_427 fixture (two domains) and asserts each memory declares page_size_log2 = 0 with minimum equal to maximum equal to the sum of its domain's placement strides (derived from the placements, not hardcoded) and at least the highest data-segment end; that without the flag no memory declares a pagesize; that the flag is refused without --pack-rebase and with --component; that the page size is attested only when it is not the default; and a wasmtime differential: the byte-paged and page-sized outputs return the same results for every function export called with zero arguments (only `now`, the allocators and the deallocator complete; the fixture's run, run2, constructor and methods run out of fuel in every strategy including --memory multi, so they compare trap to trap) and the byte-sized memory image equals the page-sized one over its extent, with a default wasmtime shown to reject (pagesize 1). meld-core/tests/byte_pages_guard_530.rs runs a cross-domain list<list<string>> deep copy on byte-sized memories: both outputs return 104 and every exported memory image matches over the extent. meld-core/tests/share_stack_380.rs shows the --share-stack branch declaring align16(max sp) + the stride sum = 4256 bytes at the F100 shape. Unit tests in meld-core/src/byte_pages.rs show the output guard firing on a hand-built module for memory.size and memory.grow (naming the function), for a data segment past the extent and for a growable byte-paged memory, and staying silent for a page-sized memory; meld-core/src/merger/tests_byte_pages_530.rs shows resource re-exporters refused; meld-core/tests/pack_rebase_370.rs shows an imported shared memory refused. meld-cli/tests/memory_page_size_530.rs shows --memory-page-size 1 accepted with --memory shared --pack-rebase (validated with custom-page-sizes enabled) and exit code 2 for 4096, for a missing --pack-rebase and for --component. Potency: each fix reverted on its own fails its tests (planner keeps pages; pages-rounded value under pagesize 1; guard no-op; guard wired; imported refusal; share-stack and plain-pack branches; placements aggregation; handle-table refusal; CLI validation feature; CLI usage refusal). Not verified: the guard's refusal through the pipeline, and the real gale cores. UPDATE 2026-10-28: independent review. Two fresh-context Mythos discover agents (claude-opus-5-5, no authoring context) reviewed the change -- one on the Tier-5 merger files (memory.rs, mod.rs), one on the output guard (byte_pages.rs) with its lib.rs/segments.rs/CLI integration. Neither found a runtime defect: on gale's real hm-thin/mpu-thin/switch-thin cores (built with gale's build-reloc-cores.sh at gale e183a59, rustc 1.99.0) 880 export calls under wasmtime 50 gave identical results, import logs and memory hashes for the page-sized and byte-paged builds, and the code sections are byte-identical to base 25e5273; gale's exact #530 command now declares (memory 2080 2080 (pagesize 1)) and (memory 5456 5456 (pagesize 1)) and is byte-identical to released v0.65.1 without the flag. Both reviewers independently CONFIRMED one attestation defect: through the library API, pack_rebase + memory_page_size Byte under Auto/MultiMemory fused ordinary 64 KiB memories while attesting memory_page_size 1 (the CLI already refused it). Fixed: byte pages are refused unless the strategy is SharedMemory (test byte_pages_are_refused_unless_the_memory_is_shared; it fails with the check disabled). The merger reviewer also found that the aggregated --domain placements could not be tied to a memory (every domain's bases start at 0, so two domains' entries read as an overlap); each PlacementRecord now carries its memory index, omitted when 0 so single-memory attestations are unchanged (test every_placement_names_its_memory_and_none_overlap: per memory the placements sum to the declared bytes and do not overlap; it fails with the index forced to 0). Recorded,