rkspace --all-features exit 0 with 930 passed and 0 failed. UPDATE 2026-10-14: the #473 Mythos delta-pass noted that two branches of the new derivation ran in no test. issue_467_two_terminal_candidates_tie_break_to_the_lowest_index builds a graph with two terminal candidates (neither imports the other) 200 times and asserts component 0 is the definer every time and both still define the resource; changing the tie-break from min to max makes it fail on the first build. issue_467_all_candidates_reexporters_leaves_no_definer makes every candidate a re-exporter and asserts no definer remains; this pins behaviour the change preserved (the old code also ended at None) and covers the branch rather than guarding against #467. Gate: fmt 0; clippy 0 with and without --all-features; cargo test --workspace exit 0 with 933 passed and 0 failed; --all-features exit 0 with 932 passed and 0 failed. UPDATE 2026-10-15: status implemented -> verified for v0.63.0. The tests recorded above passed in the required CI of #473 and #480, run on a tree merged with main, and every Tier-5 change passed a fresh Mythos delta-pass whose findings were fixed before merge. Set with `rivet modify`, deliberately not with `rivet verify`, which promotes on link presence alone."
