  - id: SWV-102
    type: sw-verification
    title: "Verification of SR-90: the stackless no-op is observed, and the unusable-marker control discriminates"
    status: verified
    description: "Verifies SR-90 in meld-core/tests/share_stack_380.rs, by observing the no-op rather than reasoning about it -- the bar set when #446 was triaged, which also recorded that a self-built fixture for a question like this had been too simple twice before. Three tests. share_stack_proceeds_for_a_stackless_provider fuses three providers where the middle one has NO `__stack_pointer` global and no name-section entry for one, which is what the builders Sp::Absent emits; the fuse must succeed, the attestation must contain `shared-stack-stackless`, and exactly TWO placements must keep the plain `shared-stack` strategy -- the second assertion matters because the first alone would be satisfied by labelling every provider stackless. It then instantiates the fused module under wasmtime and asserts each provider reads back its own data sentinel (0xA1/0xB2/0xC3), exercises the two stack-carrying providers through the coalesced SP, and re-reads the stackless providers sentinel afterwards, so a base that overlapped its window with a neighbour surfaces as a wrong read rather than as a passing structural check. share_stack_rejects_an_unusable_stack_pointer is the control that keeps the change honest: Sp::Unusable emits a global NAMED `__stack_pointer` that the name lookup finds but which is IMMUTABLE and therefore unreadable as a marker, and the fuse must still fail. Its assertion names the present-but-unusable wording specifically rather than matching `contains(\"stack\")`. share_stack_rejects_an_all_stackless_set asserts the all-stackless refusal by its message. Potency is measured, not assumed: a mutation collapsing the absent/unusable distinction (treating any unreadable marker as stackless) makes share_stack_rejects_an_unusable_stack_pointer FAIL while share_stack_proceeds_for_a_stackless_provider still passes, so the pair discriminates; with the mutation reverted all 8 tests in the file pass. The work also found the test it replaced to be VACUOUS. share_stack_requires_stack_pointer_marker asserted only err.contains(\"stack\") || err.contains(\"__stack_pointer\"), which every error on this path satisfies through its `--share-stack:` prefix. It was never observing the stack-pointer gate at all: with pack_rebase false the fuse reached the dissolves `found N __stack_pointer global(s) but M rebased memory provider(s)` drift detector, a third error neither named nor intended. Found by printing the error instead of trusting the green tick. Local gate: cargo fmt --all -- --check exit 0; cargo clippy --workspace --all-targets -D warnings exit 0; cargo test --workspace exit 0 with 916 passed and 0 failed; cargo test --workspace --all-features exit 0 with 915 passed and 0 failed. Not established here: behaviour on one of gales real forwarders. The fixture is synthetic, and its stackless provider places data high (at 30256) where a real stackless module would place it low, so the reserved stride in this test is correspondingly large; the layout arithmetic is the same either way, but the packing benefit on real bytes is unmeasured and wants gale confirming on a 1.99.0 build. UPDATE 2026-10-07: the auto-Mythos delta-pass FAILED this change's first cut and was right to. It reported that a module whose stack pointer is defined but invisible to the export-table and name-section lookup would be classified stackless, leaving its pointer un-rewritten while the shared region was sized without it, so its frames would write into the shared region and a neighbour's data -- silent corruption in an input the previous contract rejected. Confirmed by construction rather than argument, and fixed by requiring the absence of any unnamed stack-pointer-shaped global before admitting a module as stackless. New test share_stack_rejects_an_unnamed_stack_pointer_candidate builds exactly that module -- a defined mutable i32 global with a const init, neither exported nor named -- and asserts the refusal names both halves. Potency measured: removing the candidate check makes ONLY that test fail while the stackless-admission test still passes, so the pair discriminates the two cases rather than passing either way; restored, all 10 tests in the file pass. Worth recording that this is the second checker to catch an error in this change before a human did: the traceability ratchet found the missing typed links, and the delta-pass found the soundness hole. Re-run gate: fmt 0, clippy 0, test --workspace 0 with 918 passed and 0 failed, test --all-features 0 with 917 passed and 0 failed. UPDATE 2026-10-07: status implemented -> verified. All ten tests in meld-core/tests/share_stack_380.rs pass, the stackless admission is observed on wasmtime rather than reasoned about, and the soundness hole the auto delta-pass raised against the first cut is closed and re-checked by that same gate reporting NO FINDINGS on the fixed change. Set with `rivet modify`, deliberately not with `rivet verify`, which promotes on link presence alone."
    links:
      - type: verifies
        target: SR-90
    provenance:
