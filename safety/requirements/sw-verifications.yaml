  - id: SWV-46
    type: sw-verification
    title: "Verification of SR-56: Reject overlapping data segments in the fused output"
    description: >
      Verifies SR-56 via meld-core/tests/shared_overlap_370.rs (3 cases):
      (negative) two components each placing a data segment at the wasm-ld base
      1048576 under `--memory shared` without `--address-rebase` now hard-fail
      with Error::OverlappingDataSegments (pair_count 1, memory 0, start
      1048576); (positive-disjoint) well-separated offsets fuse clean;
      (positive-adjacent) `[0,4)` and `[4,8)` touch but do not overlap and fuse
      clean, pinning the strict `start < max_end` boundary. The detector
      (segments::find_overlapping_data_segments / check_no_overlapping_data_segments,
      running-max-end scan) runs on the EMITTED core module in
      lib.rs::fuse_with_stats_resolved before the optional component wrap, so it
      is strategy- and flag-agnostic. A warn-only probe across the full suite
      (42 integration binaries) confirmed no existing fixture legitimately
      overlaps; an adversarial Mythos delta-pass returned no validated finding.
    status: implemented
    fields:
      method: automated-test
    links:
      - type: verifies
        target: SR-56
  - id: SWV-47
    type: sw-verification
    title: "Verification of SR-57: Compact used-extent address rebasing (--pack-rebase)"
    description: >
      Verifies SR-57 via the differential-execution oracle
      meld-core/tests/pack_rebase_370.rs: three reloc-bearing components, each
      seeding a distinct sentinel via an ACTIVE data segment at 0x100 and
      reading it back through a reloc-flagged absolute address, fused under
      `--pack-rebase`. Asserts (1) the combined memory minimum shrinks from 3
      pages (page-granular `--address-rebase`) to 1 page (packed) — a hard
      inequality, both numbers printed — the size claim; and (2) on wasmtime
      each component reads back ITS OWN sentinel (0xA1/0xB2/0xC3), so a stride
      one min_start too short surfaces as a wrong read, not a silent pass. The
      layout is in merger.rs::compute_shared_memory_plan (16-byte-aligned
      used-extent stride via module_used_data_extent + compacted combined
      memory); the reloc machinery is unchanged. The default page-granular path
      is behavior-preserved (rebasing_end_to_end.rs et al. green). Two more cases
      pin the Mythos SR-57 findings that a data-segment extent scan misses:
      pack_rebase_passive_init_does_not_clobber (passive-data + memory.init;
      before the fix all three read 0xC3) and
      pack_rebase_nodata_module_does_not_alias (a memory with no static data
      segments → extent 0 → align16(0)=0 stride → base aliasing; before the fix
      both read 0xB2). Both fall back to page-granular and stay isolated.
    status: implemented
    fields:
      method: automated-test
    links:
      - type: verifies
        target: SR-57
  - id: SWV-48
    type: sw-verification
    title: "Verification of SR-58: Cross-memory params-area copy (combined params-ptr + retptr)"
    description: >
      Verifies SR-58 by flipping the runtime differential test
      meld-core/tests/wit_bindgen_runtime.rs::test_runtime_wit_bindgen_fixed_length_lists
      from tolerating the guest trap to asserting run() SUCCEEDS; the guest
      assert_eq on the round-tripped fixed-size-list values is the oracle (red
      before the fix — callee read params from its own memory at the caller's
      address → all-zeros → trap; green after). Fix in adapter/fact.rs: extracted
      emit_params_area_copy (Phases 1-3.5 of the params-ptr adapter) and a
      uses_params_area branch in generate_retptr_adapter that reserves scratch
      AT THE END (no existing local index shifts), gates the flat-coordinate
      Phase 0/1/1b behind !uses_params_area, and pushes the copied callee buffer
      pointer instead of the caller's raw params_ptr. Mythos delta-pass returned
      NO VALIDATED FINDING (worst-case local map reconstructed, no overlap;
      refactor byte-identical; full 74-test runtime suite green). It surfaced a
      pre-existing latent gap — nested inner_pointers (list<string>/list<list>)
      inside a >16-param buffer were not relocated on either path — now made
      LOUD (fail-loud Err) in the shared helper rather than left silently
      dangling. Full suite 804 passed / 44 binaries / 0 failed.
    status: implemented
    fields:
      method: automated-test
    links:
      - type: verifies
        target: SR-58
  - id: SWV-49
    type: sw-verification
    title: "Verification of SR-59: Loud no-reloc acceptance + static-PIC global-init fold"
    description: >
      Verifies SR-59 via two wasmtime-backed oracles (both confirmed red→green
      by stash). Global-init fold:
      meld-core/tests/pic_extended_const_353.rs::pic_extended_const_global_init_valid_and_rebased_339
      — a global initialized `__memory_base + 8` fused under shared+rebase; RED
      before (wasmtime rejects the unfolded `global.get <defined>` init), GREEN
      after (accepts; get_g() == base+8 == 65544). merger.rs::fold_defined_base_init
      folds a leading defined-const-base extended-const to a concrete i32.const,
      extending the #353 offset fold to global initializers (reusing
      segments::eval_ext_const_i32_with_base). Loud acceptance:
      meld-core/tests/value_address_warn_339.rs — a no-reloc value-address module
      fires the address_strategy path-F accept warning and still validates
      (non-regression for #298/#304). Mythos delta-pass: NO DELTA-INTRODUCED
      FINDING (immutable-only + i32-only base map rules out mutable-drift/type
      misfire; value-preserving). Documented residuals NOT claimed fixed: the
      bare no-reloc absolute-const global and the operand-swapped defined-base
      form (both undecidable / pre-existing; the latter fails loud at wasmtime
      instantiation). #299 memory.grow diagnostic rides under SR-50.
    status: implemented
    fields:
      method: automated-test
    links:
      - type: verifies
        target: SR-59
  - id: SWV-50
    type: sw-verification
    title: "Verification of SR-60: Const-expr fold equivalence-checked against certified QF_BV (ordeal)"
    description: >
      Verifies SR-60 via meld-core/src/segments.rs::ordeal_fold_proof (9 tests,
      test-only + one dev-dep `ordeal 0.18`). Harness A (64 boundary-biased cases
      per width) encodes each extended-const to bytes with wasm_encoder, drives
      the SHIPPED fold (parse_const_expr_with_value → fold_extended_const_i32/i64),
      builds an independent QF_BV term, and asserts ordeal::Solver::prove_equiv is
      Unsat with cert.recheck() passing (Unknown = hard failure; certificate
      non-vacuous — ordeal-lrat requires deriving the empty clause). Harness B
      cross-checks eval_ext_const_i32_with_base. Negative controls (asserted SAT):
      the #338 `base + 16 == base` truncation refuted symbolically over free base,
      swapped-sub, and off-by-one add. wasmtime anchoring: 3 wrap-boundary cases.
      DISCRIMINATION PROVEN by mutation: injecting wrapping→saturating at each of
      the three fold sites turns the matching harness RED (each caught, reverted).
      Exercises shipped code, not a re-implementation. Full suite 815/45/0.
    status: implemented
    fields:
      method: automated-test
    links:
      - type: verifies
        target: SR-60
  - id: SWV-51
    type: sw-verification
    title: "Verification of SR-63: Embedder-provided allocator seam survives fusion"
    description: >
      Verifies SR-63 via meld-core/tests/rebasing_end_to_end.rs. Oracle
      test_301_embedder_arena_seam_survives_fusion_differential: two synthetic
      arena core modules each importing env::__cabi_arena_realloc are fused under
      SharedMemory + address_rebasing, then asserts (a) the fused core validates
      (wasmparser all-features), (b) the import is RETAINED — an import-symbol
      scan finds exactly ONE unresolved env::__cabi_arena_realloc (the two dedup
      onto one seam, first-wins, not bound to a provider nor dropped), and (c)
      DIFFERENTIAL EXECUTION on wasmtime with a host bump-arena via Linker: fused
      return values, handed-out pointer sequence, and in-memory sentinel
      placement all equal the unfused components run through the same host arena
      (a_run != b_run, independently wired). A companion
      test_301_embedder_arena_seam_nonzero_base_requires_relocs pins that module
      B is placed at a non-zero base (0x10000) and hard-fails MissingRelocMetadata
      without relocs — anti-vacuity for (c)'s sentinel-at-address check. SCOPE:
      proves meld's pass-through plumbing with synthetic WAT; the real
      forked-toolchain artifact path (wit-bindgen#4 / wasm-tools#2) is a
      documented follow-up, not claimed here. Full suite 817/45/0.
    status: implemented
    fields:
      method: automated-test
    links:
      - type: verifies
        target: SR-63
