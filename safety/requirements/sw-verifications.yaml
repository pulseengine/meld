  - id: SWV-47
    type: sw-verification
    title: "Verification of SR-57: Compact used-extent address rebasing (--pack-rebase)"
    description: >
      Verifies SR-57 via the differential-execution oracle
      meld-core/tests/pack_rebase_370.rs: three reloc-bearing components, each
      seeding a distinct sentinel via an ACTIVE data segment at 0x100 and
      reading it back through a reloc-flagged absolute address, fused under
      `--pack-rebase`. Asserts (1) the combined memory minimum shrinks from 3
      pages (page-granular `--address-rebase`) to 1 page (packed) — a hard
      inequality, both numbers printed — the size claim; and (2) on wasmtime
      each component reads back ITS OWN sentinel (0xA1/0xB2/0xC3), so a stride
      one min_start too short surfaces as a wrong read, not a silent pass. The
      layout is in merger.rs::compute_shared_memory_plan (16-byte-aligned
      used-extent stride via module_used_data_extent + compacted combined
      memory); the reloc machinery is unchanged. The default page-granular path
      is behavior-preserved (rebasing_end_to_end.rs et al. green). Two more cases
      pin the Mythos SR-57 findings that a data-segment extent scan misses:
      pack_rebase_passive_init_does_not_clobber (passive-data + memory.init;
      before the fix all three read 0xC3) and
      pack_rebase_nodata_module_does_not_alias (a memory with no static data
      segments → extent 0 → align16(0)=0 stride → base aliasing; before the fix
      both read 0xB2). Both fall back to page-granular and stay isolated.
    status: implemented
    fields:
      method: automated-test
    links:
      - type: verifies
        target: SR-57
