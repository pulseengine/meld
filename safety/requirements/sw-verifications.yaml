    description: "Verifies SR-79 via meld-core/tests/wide_used_params_423.rs against a new offline fixture (tests/wit_bindgen/fixtures/compose_record_use_wide, built by its build.sh from WAT with wasm-tools and wac). The fixture is the falcon shape: tick(state: 14 f32, sp: 4 f32) -> out, every record reached through `use`, so the true flattened parameter count is 18 — over MAX_FLAT_PARAMS — and the emitted core signature is a single pointer. The existing compose_record_use fixture cannot reach this: its records are 4 wide, so the wrong count and the right one are both under the limit, which is why #393's size fix was sufficient there. used_records_count_their_real_flat_width asserts meld's own total_flat_params is 18; wide_used_params_survive_fusion fuses and runs the result under wasmtime against an oracle of 120. Red first, and the failure mode it establishes is the severe one: before the fix the count was 2, the fused module VALIDATED, ran without trapping, and returned 0 instead of 120 — a wrong answer at exit 0, not a loud failure. The fix routes sixteen type traversals through resolve_defined_val_type; the full suite then caught a real consequence in wit_bindgen_runtime (test_fuse_wit_bindgen_with), where meld's own parallel-list assertion fired because collect_param_pointer_wit_types in resolver.rs was a seventeenth site still stopping at the alias. Every get_type_definition call site in the workspace was then classified: value-type traversals were converted, function-type lookups were left. Correction (2026-09-18, v0.58.0): this entry said the fixture is built by its build.sh, and that script did not exist when the entry was written — the fixture had been built by hand with the same wasm-tools/wac commands. build.sh was written in v0.58.0 and verified to reproduce the committed artifacts byte-identically (composed_wide_use.wasm and provider.wasm unchanged by a rebuild)."
