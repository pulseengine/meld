TE 2026-10-15 (third rework): a further Mythos delta-pass found that a lower's realloc was resolved from its source only when there was more than one fused memory; with one fused memory, which includes every --memory shared fuse, it fell back to cabi_realloc, so a lower naming another allocator returned 102 instead of 202 at exit 0. The realloc is now resolved from the source lower in every strategy, an unresolvable one is an error, and lowers sharing a fused import must agree on it. lower_realloc_is_the_source_one_with_a_single_memory runs the fixture under multi and shared: 202 with the fix, 102 under multi on the previous head (the shared case was not separately observed failing there, since the test stops at the first failing strategy). Corpus: the 49 wit-bindgen fixtures stay byte-identical; five release-0.2.0 fixtures change (calculator, datetime and hello_rust one lower each, the two yolo_inference builds six each), each change being a lower now naming the WASI adapter's cabi_import_realloc instead of cabi_realloc, plus the core-func renumbering that alias causes. golden_e2e runs fused hello_rust under wasmtime against the unfused output and passes; hello_rust, datetime and calculator were also run by hand and match. Gate: fmt 0; clippy 0 with and without --all-features; cargo test --workspace exit 0 with 963 passed and 0 failed; --all-features exit 0 with 962 passed and 0 failed. UPDATE 2026-10-15: status implemented -> verified for v0.63.0. The tests recorded above passed in the required CI of #490 and #496, each run on a tree merged with main, and the final commit passed a fresh Mythos delta-pass with no findings. Set with `rivet modify`, deliberately not with `rivet verify`, which promotes on link presence alone."
