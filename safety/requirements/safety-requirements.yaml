  # ==========================================================================
  # #370 — shared-memory data-segment overlap (v0.43.0)
  # ==========================================================================

  - id: SR-56
    type: sw-req
    title: Reject overlapping data segments in the fused output
    description: >
      The fuser shall detect active data-segment ranges that overlap within a
      linear memory in the EMITTED module and hard-fail with a diagnostic —
      regardless of memory strategy or flags. An overlap is never an intended
      output: active segments are applied in declaration order at instantiation,
      so a later segment silently overwrites an earlier one (LS-M-12). The check
      is local to the emitted module and therefore catches the general case,
      including any future path that forgets to rebase. In particular
      `--memory shared` WITHOUT `--address-rebase` merges memories but shifts no
      offsets, so every input's `.rodata`/`.data` at the standard `wasm-ld` base
      collides; today that exits 0 with no diagnostic, while the sound
      `--address-rebase` path correctly refuses on missing relocations — the
      safe-looking flag reaches the worse end state. The hard-fail's own
      diagnostic carries the remediation (it names both `--address-rebase` and
      the compact `--pack-rebase`), so no separate advisory warning is emitted —
      a warning that fired on configurations that did NOT overlap would be noise
      that trains users to ignore meld's stderr.
    status: verified
    tags: [merger, memory, shared, safety, silent-corruption]
    release: v0.43.0
    links:
      - type: derives-from
        target: SYS-2
      - type: mitigates
        target: LS-M-12
      - type: refines
        target: SR-37
    cited-source:
