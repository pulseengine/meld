  - id: SR-32
    type: sw-req
    title: Stackful P3 lifting mode emission
    description: >
      In addition to the callback trampoline (shipped #128), meld shall
      emit a stackful lifting trampoline for components that declare
      `(canon lift ... async ...)` without a `(callback ...)` option.
      The Phase 1 ABI surface (`pulseengine:async::thread_new`,
      `thread_switch_to`, `thread_yield`, `thread_exit`) is reserved
      for component-internal concurrency primitives. The shipped
      trampoline calls the lift function directly and relies on the
      runtime to treat the call as a fiber boundary (transparent
      suspension on `task.wait`). Cross-memory `(ptr, len)` result
      returns from stackful mode are deferred to a follow-up under
      the same issue. Documented in ADR-1 addendums 2026-05-13 (a)
      and 2026-05-13 (b).
