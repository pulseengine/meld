        kind: github
        last-checked: 2026-08-14
    fields:
      implementation:
        - meld-core/src/merger/memory.rs
        - meld-core/src/mcu_dissolve.rs
      verification-method: test
      verification-description: >
        Verified by meld-core/tests/share_stack_380.rs (differential-execution
