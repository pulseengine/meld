  # SR-37 was accidentally deleted by PR #226 (commit fafd00c); restored
  # verbatim from c50d9d5 in the v0.31.0 traceability audit, with status
  # upgraded implemented → verified on the recorded evidence.
  - id: SR-37
    type: sw-req
    title: Automatic memory-strategy resolution (sound-by-construction default)
    description: >
      `MemoryStrategy::Auto` — the default for both `FuserConfig` and the
      `meld fuse` CLI — shall resolve to **multi-memory**, the strategy
      that is sound by construction for arbitrary inputs. Auto shall
      NOT select shared memory + address rebasing: address rebasing does
      not relocate the dynamic address operand of ordinary load/store
      instructions (only the static memarg offset and bulk-memory ops),
      so components that address memory via computed pointers — heap,
      shadow stack, i.e. all real components — would silently collide
      in a shared memory (#326, LS-M-11). Shared memory + rebasing shall
      remain reachable only by explicit selection (`--memory shared
      --address-rebase`), which shall emit a loud unsoundness warning.
      The resolved strategy shall be reported in `FusionStats` and
      recorded in the attestation / provenance metadata as the concrete
      strategy, never as "auto".
      History: the prior form of SR-37 (v0.22.0) required Auto to prefer
      shared+rebasing for grow-free multi-memory inputs — that
      requirement was UNSOUND (it specified a corrupting transform) and
      is superseded here by the #326 gate. The single-address-space
      (MCU) benefit that shared fusion was meant to provide (#172, #298,
      #299) requires correct dynamic-address rebasing in `rewriter.rs`
      first (tracked follow-up); until then Auto trades that benefit for
      correctness and its output needs `--enable-multimemory`.
    status: verified
    tags: [usability, memory-strategy, v0.22.0, v0.38.0]
    links:
      - type: derives-from
        target: SYS-6
      - type: mitigates
        target: LS-M-7
      - type: mitigates
        target: LS-M-11
    cited-source:
      - uri: "https://github.com/pulseengine/meld/issues/172"
        kind: github
        last-checked: 2026-06-24
    release: v0.38.0
    fields:
      implementation:
        - meld-core/src/memory_probe.rs
        - meld-core/src/lib.rs
      verification-method: test
      verification-description: >
        Unit tests on the probe (grow detected anywhere in any body;
        memory.size not a false positive; malformed input counts as
        growing — `ls_m_7_malformed_input_counts_as_grow`). Integration
        oracle in tests/auto_memory.rs: grow-free inputs fuse to a
        single-memory output that validates with multi-memory disabled
        (the `wasm-opt -Os` feature set) and behaves correctly at
        runtime; a growing input resolves to multi with both memories
        preserved (`ls_m_7_auto_keeps_multi_when_input_grows`);
        explicit strategies are never overridden. Manual evidence on
        the issue repro: `meld fuse a b -o fused.wasm` then
        `wasm-opt -Os fused.wasm` succeeds with no flags; the explicit
        `--memory multi` control still reproduces the rejection.
        Verified (v0.31.0 audit): tests/auto_memory.rs suite 5/5 green
        plus the ls_m_7_* tests discovered and passing through the LS
        verification gate.
      milestone: v0.22.0

  - id: SR-38
    type: sw-req
    title: Multi-source DWARF merge (bounded relocator)
    description: >
      When more than one input core module carries `.debug_*` sections,
      `DwarfHandling::Remap` shall convert and address-remap EACH
      source independently (per-module `AddressRemap`) and merge the
      resulting section sets into one coherent set via concatenation
      plus bounded relocation of the known cross-section references
      (CU abbrev offset, `strp`, `stmt_list`/`ranges`/location
      sec_offsets, `ref_addr`). Inputs outside the bounded repertoire
      (DWARF64, version != 4, unexpected sections or forms) shall
      abort the merge and fall back to synthetic-only emission —
      never a guessed offset. A source whose remap fails is dropped
      individually; the others proceed.
