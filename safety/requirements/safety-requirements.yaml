  - id: SR-67
    type: sw-req
    title: Shared-stack call-topology envelope gate (--share-stack, SR-67)
    description: >
      Under `--share-stack` (SR-66) the shared shadow-stack region is sized
      `max_i(sp_i)`, which is sound only while at most one stack is live at a
      time. The region is per-MODULE, not per-component:
      `mcu_dissolve::coalesce_stack_pointers` collapses EVERY `__stack_pointer`
      across all components AND modules onto one survivor, so every module's stack
      lives in the single region. A call from one memory-bearing module into
      another — cross-component OR intra-component cross-module — makes the caller
      live while the callee runs, so the live requirement along a call chain is
      the SUM of the participants' stacks, not the max. meld shall analyse the
      fused-set call graph with nodes = `(component, module)` and edges = every
      cross-module function call: `AdapterSite`s (cross-component + intra-component
      encoding-differing calls) UNION function-kind `module_resolutions`
      (intra-component cross-module calls that never become adapter sites).
      Resource-op and async-lift calls count too (they still execute callee code
      on the shared stack). Weighting each node by its module `sp`:
        (a) NO cross-module edges → the region is sound; proceed silently
            (the current gale/F100 shape).
        (b) an ACYCLIC call graph (an orchestrator DAG) whose worst root-to-leaf
            `sp`-sum EXCEEDS the region → `log::warn!`, naming the chain, the
            required sum, and the region (the region may be undersized but
            boundedly; the integrator judges it against real per-stage stack
            bounds). If the worst chain still fits the region, proceed silently
            (max-sizing already covers it).
        (c) a call CYCLE (A→…→A, or recursion through a sibling) → the live
            depth is unbounded → HARD-FAIL (the same loud-refusal posture as
            SR-66's other gates), naming the cycle.
      This is the mechanical form of the self-check the falcon supplier (fathom)
      proposed on #370 ("a seam that vanishes from the residual imports is a
      component now calling a sibling"): meld sees the internalized call directly
      (the merger resolves each cross-component import to its export target),
      more precisely than an external undefined-symbol diff. A blanket refuse on
      ANY edge was rejected — it would break the natural orchestrator
      composition, which is sound at `max_i(orchestrator + driver_i)`; the
      three-way disposition distinguishes it from unbounded recursion.
    status: implemented
    tags: [merger, memory, shared, mcu, share-stack, shadow-stack, call-graph]
    release: v0.49.0
    links:
      - type: derives-from
        target: SYS-6
      - type: mitigates
        target: LS-M-12
      - type: refines
        target: SR-66
    cited-source:
      - uri: "https://github.com/pulseengine/meld/issues/382"
        kind: github
        last-checked: 2026-08-14
    fields:
      implementation:
        - meld-core/src/merger/memory.rs
      verification-method: test
      verification-description: >
        Verified by meld-core/src/merger/memory.rs::topology_tests (14 tests).
        The pure graph analysis analyze_call_topology is covered by 7 unit tests:
        no-edges → NoEdges; chain/fanout/diamond → the correct worst weighted
        (sp-sum) path; a 2-cycle and a cycle-with-a-DAG-prefix → Cyclic. The gate
        method check_share_stack_call_topology is covered by 7 method-level tests
        on a constructed DependencyGraph: no cross-component sites → Ok; intra-
        component SAME-module self-edges ignored → Ok; a call cycle → Err naming
        the cycle; a DAG that fits the region → Ok (silent); a DAG that exceeds it
        → Ok (warn); AND (Mythos SR-67 Finding 1 regressions) an intra-component
        CROSS-module cycle → Err and an intra-component cross-module DAG over the
        region → warn — the per-module granularity the old per-component gate
        missed. A local Mythos delta-pass confirmed the pure graph engine sound
        against missed-cycle / undercounted-path attacks, and found the
        per-component granularity gap (the shared stack is per-module: two modules
        in one component that call each other share the region); fixed by keying
        nodes on (component, module) and adding function-kind module_resolutions
        edges. The share_stack_380 oracle (mutually-non-calling providers) confirms
        the gate is a no-op on the current shape.
        NOTE (coverage): a single fixture combining a real cross-component call
        WITH the --share-stack markers is not built (needs component-model
        composition machinery); the adapter-site/module_resolutions → gate wiring
        is covered by the method-level tests plus the existing adapter-site tests
        rather than one end-to-end fixture.
        KNOWN GAP (Mythos Finding 3, unconfirmed): a standalone resource-DESTRUCTOR
        call routed via handle tables rather than an adapter site would not appear
        as an edge; narrow for the scalar MCU driver shape (no resources),
        documented rather than claimed-covered.
      references:
        - "https://github.com/pulseengine/meld/issues/382"
        - "meld-core/src/merger/memory.rs"

  - id: SR-68
    type: sw-req
    title: Sealed-safety build profile refuses inferred safety-relevant properties
    description: >
      meld shall provide an explicit build-profile selector (`--profile`,
      `FuserConfig::profile`) implementing ADR-7's two attested profiles. Under
      `Profile::Safety` (the sealed-safety profile) meld shall REFUSE to infer any
      safety-relevant property that the build should have declared, returning
      `Error::SafetyProfileViolation` rather than emitting a warning and
      proceeding. Under `Profile::Ecosystem` (the default) the same conditions
      remain advisory, so the generic RFC-46 identity is unaffected. The profile
      shall GATE only: a build that succeeds under `Safety` shall produce
      byte-identical output to the same explicit invocation under `Ecosystem`.
      The check shall run BEFORE fusion, so a profile violation is a build
      configuration error that cannot depend on input shape or leave a partially
      produced artifact.
      Enforced property (first consumer, ADR-4 "explicit, not auto"): the MEMORY
      STRATEGY. `MemoryStrategy::Auto` selects the inter-component isolation model
      (one shared address space vs one memory per component), which decides
      whether a fault in one component can reach another's state; a safety build
      must state `--memory` explicitly. NOTE the profile is required precisely
      BECAUSE this cannot be gated on attestation: `attestation` defaults true and
      `--memory` defaults to `auto`, so "attested + Auto" is the DEFAULT
      invocation, and erroring there would break the ecosystem identity ADR-7
      declared first-class (#386).
      Intended future consumers (ADR-7 binding requirements, NOT yet implemented):
      per-boundary call-lowering / address strategy declared and attested, and
      silent-downgrade-is-a-hard-error where a declared strategy's preconditions
      are unmet.
    status: implemented
    tags: [profile, safety, adr-7, adr-4, memory, configuration]
    release: v0.50.0
    links:
      - type: derives-from
        target: SYS-6
      - type: refines
        target: SR-57
    cited-source:
      - uri: "https://github.com/pulseengine/meld/issues/386"
        kind: github
        last-checked: 2026-08-19
    fields:
      implementation:
        - meld-core/src/lib.rs
      verification-method: test
      verification-description: >
        Verified by meld-core/tests/safety_profile_386.rs (4 tests):
        safety_profile_refuses_to_infer_the_memory_strategy (Auto under Safety →
        Err naming both the violation and the remedy `--memory`);
        safety_profile_accepts_an_explicit_memory_strategy (explicit → fuses);
        ecosystem_profile_still_infers (the DEFAULT path is untouched — this is
        what makes the profile non-breaking); and profile_gates_but_does_not_
        transform (a Safety build's bytes equal the same explicit Ecosystem
        build's, under `reproducible: true` so the comparison is of fusion output
        rather than attestation nonce) — pinning that the profile gates rather
        than transforms. Documented as the `profiles` topic in `meld docs`.
      references:
        - "https://github.com/pulseengine/meld/issues/386"
        - "meld-core/tests/safety_profile_386.rs"

  - id: SR-69
    type: sw-req
    title: Per-boundary strategy and build configuration are attested and observable
    description: >
      ADR-7 binds meld to make each fused boundary's strategy DECLARED, ATTESTED
      and OBSERVABLE. meld shall (a) record one entry per fused cross-component
      call boundary — caller/callee component+module, the callee function and
      interface, the call-lowering class chosen (`direct` / `memory-copy` /
      `transcode` / `async-lift`) and how the call was ACTUALLY wired
      (`inlined-direct` / `widening-wrapper` / `thunk`) — and (b) record the
      build configuration that shaped the artifact. Both shall be embedded in the
      fusion attestation carried by the output, and (a) shall additionally be
      printable via `meld fuse --explain`.
      The wiring field shall be captured at the WIRING step, not from the
      call-lowering seam's `inline_eligible`: a widening wrapper takes precedence
      over inlining, so eligibility alone would misreport what shipped.
      Records shall be emitted in `adapter_sites` order, which the resolver sorts
      into a total order, and the configuration shall be a TYPED structure rather
      than a map, so both serialize deterministically and `--reproducible` output
      stays byte-stable. Neither perturbs the artifact hash, which is computed
      over the module with the attestation and provenance sections stripped.
      This CORRECTS a traceability defect: SR-28 requires every `FuserConfig`
      field to be recorded so an auditor can reconstruct the build, but the
      parameter set was gated behind the optional `attestation` (wsc) feature,
      which releases do NOT build — so shipped artifacts recorded no
      configuration beyond the memory strategy. `--share-stack` (a documented
      soundness envelope), `--pack-rebase`, `--address-rebase` and `--profile`
      were all unattested. The SR-28 sentinel could not catch it because it
      asserted against a map built inline in the test rather than real output.
      SR-28 completeness shall therefore be enforced at COMPILE TIME: the
      parameter-building function destructures `FuserConfig` exhaustively, so
      adding a field fails the build until it is recorded or explicitly
      acknowledged as not a build parameter.
    status: implemented
    tags: [attestation, adr-7, traceability, observability, boundary, config]
    release: v0.51.0
    links:
      - type: derives-from
        target: SYS-6
      - type: refines
        target: SR-28
    cited-source:
      - uri: "https://github.com/pulseengine/meld/issues/386"
        kind: github
        last-checked: 2026-08-19
    fields:
      implementation:
        - meld-core/src/lib.rs
        - meld-core/src/attestation.rs
        - meld-cli/src/main.rs
      verification-method: test
      verification-description: >
        Verified by meld-core/tests/boundary_records_p1.rs (3 tests): one record
        per generated adapter with valid lowering/wiring labels AND agreement
        between the `inlined-direct` records and `stats.adapters_inlined` (the
        check that catches eligibility-vs-outcome confusion); records recovered
        from the attestation custom section of the fused artifact with every
        expected key present; and byte-stability of the records across two runs.
        Configuration attestation verified by the strengthened
        attestation::tests::test_sr28_config_completeness, which now asserts
        against the REAL serialized attestation (all ten parameter keys present,
        values round-tripping) instead of a map built inline. The compile-time
        completeness guarantee was demonstrated by adding a probe field to
        `FuserConfig` and observing `error[E0027]: pattern does not mention
        field` at the sentinel, then removing it. Both feature configurations
        green (`--workspace` 858/0, `--all-features` 857/0).
      references:
        - "https://github.com/pulseengine/meld/issues/386"
        - "meld-core/tests/boundary_records_p1.rs"
