# meld's toolchain pin: the `covalent` layer, which composes the PulseEngine
# methodology toolchain (spar, witness, wsc, ...) with the component-model
# tools (wasm-tools, wac, wkg, ...). Changing layers is a reviewed edit here.
#
# `varve which <tool>` says which layer each tool on PATH comes from.
manifest-version = 1

[toolchain]
realm   = "covalent"
channel = "rolling"
layer   = "2026.11.10"
