name: Bench Smoke

# Compile-only sanity check for the criterion fusion benches. Catches the
# common regression where someone refactors a public API and the benches
# silently rot. Does NOT run the actual benchmarks — running them on shared
# CI runners produces noisy, untrustworthy numbers and slows PR feedback.
#
# Full benchmark runs are intended to live on a dedicated host (or be
# reproduced locally with `cargo bench -p meld-core`).
#
# Security note: every `run:` step below uses values that come exclusively
# from the workflow file itself. No untrusted event payloads (issue/PR
# titles, commit messages, branch refs from forks, etc.) are interpolated
# into shell commands. If you add steps that consume `github.event.*` data,
# route it through `env:` first.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  # Not on push to main: each change already ran this on its PR, and the
  # main re-run only queued on the shared rust-cpu pool (measured ~100 min
  # queue per main push, 2026-10). A nightly run still covers main itself.
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'safety/**'
      - 'scripts/mythos/**'
      - 'tools/*.py'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bench-smoke:
    name: Bench compile-only
    # Routes fork PRs to GitHub-hosted runners by default. This is NOT a security
    # boundary: a fork PR can edit this file. Isolation is enforced by the org's
    # smithy runner-group policy and fork-PR approval (pulseengine/warte#35).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, toolchain pinned
        with:
          toolchain: 1.100.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-

      - name: Compile benches (no run)
        run: cargo bench --locked -p meld-core --no-run
