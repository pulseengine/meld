name: Proofs

# meld carries 14,487 lines of Rocq across 28 files — 350 `Qed`, 0 `Admitted`,
# with proofs/STATUS.md honestly marking which stages are Covered and which are
# Placeholder. None of it was ever re-checked: all 15 `rocq_proof_test` targets
# are tagged `manual` (which excludes them from Bazel wildcards) and no workflow
# invoked bazel at all. A proof nothing runs is a document, not evidence, and a
# half-finished verification story is worse than an absent one because it reads
# as done.
#
# The `manual` tags stay: rules_rocq_rust needs nix, and a bare `bazel test //...`
# on a runner without it should not fail. This job names the suite explicitly,
# which reaches manual targets, and provisions nix the way synth's proof job does.

concurrency:
  group: proofs-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rocq:
    name: Verify Rocq proofs
    # ubuntu-latest, not a self-hosted runner: needs Nix + Bazel + Rocq, which
    # the self-hosted pool does not provision (same reasoning as synth's job).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # `bazel test` exits 4 for NO TESTS MATCHED. Swallowing it is how a proof
      # gate passes while selecting nothing — synth hit exactly this and says so
      # in its own workflow. Exit 4 is a FAILURE here: if the suite selects
      # nothing, the suite or the tags changed and nobody is checking the proofs.
      - name: Verify the proof suite
        run: |
          set -uo pipefail
          bazel test //proofs:verify_all --test_output=errors
          rc=$?
          if [ "$rc" -eq 4 ]; then
            echo "::error::bazel selected NO TESTS for //proofs:verify_all — the"
            echo "::error::suite is empty or its members were renamed. This is not a pass."
            exit 1
          fi
          exit "$rc"

      # Says out loud how much was checked, so a shrinking suite is visible in
      # the log rather than only in a diff nobody reads.
      - name: Report what was verified
        if: always()
        run: |
          set -euo pipefail
          n=$(bazel query 'tests(//proofs:verify_all)' 2>/dev/null | wc -l | tr -d ' ')
          echo "::notice::proof tests in //proofs:verify_all: $n"
          echo "Rocq files: $(find proofs -name '*.v' | wc -l | tr -d ' ')"
          echo "Qed:        $(grep -rc 'Qed\.' proofs --include='*.v' | awk -F: '{s+=$2} END {print s}')"
          echo "Admitted:   $(grep -rc 'Admitted\.' proofs --include='*.v' | awk -F: '{s+=$2} END {print s}')"
