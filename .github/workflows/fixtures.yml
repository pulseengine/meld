name: Update wit-bindgen Fixtures

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'

env:
  CARGO_TERM_COLOR: always
  WIT_BINDGEN_VERSION: "0.63.0"
  WASMTIME_VERSION: "49.0.2"

jobs:
  update-fixtures:
    name: Generate wit-bindgen fixtures
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, toolchain pinned
        with:
          toolchain: 1.100.0
          targets: wasm32-wasip2

      # `bytecodealliance/actions/wasmtime/setup@v1` resolves $HOME to
      # /home/runner11 — the runner's NAME, not a directory that exists — and
      # failed with `ENOENT: no such file or directory, mkdir '/home/runner11'`
      # on every scheduled run since at least 2026-08-24 (#429). Five weeks,
      # never once succeeded. Other workflows on the same rust-cpu label pass,
      # so it is the action's assumption about $HOME, not a broken box.
      #
      # HOME is overridden for this step alone, which is the smallest fix that
      # does not change what the job installs.
      #
      # It is NOT dead weight, though it looked like it: nothing in this file
      # invokes `wasmtime`, and the e2e rules that executed fused modules under
      # it went away with the Bazel build (#406/#407). I removed the step on
      # that reading and dispatched the job to check. It got further and then
      # failed:
      #
      #     Error: runner `wasmtime` failed to spawn
      #     Caused by: No such file or directory (os error 2)
      #
      # `wit-bindgen test` spawns the wasmtime CLI to RUN the generated tests.
      # The dependency is real and invisible in this file — hence this comment,
      # so the next person reading it does not reach the same wrong conclusion.
      # Installed directly rather than via bytecodealliance/actions/wasmtime/setup@v1,
      # which cannot work on this runner topology. Measured across three
      # dispatches (#429): the action downloads and extracts fine and then dies
      # on `ENOENT: no such file or directory, mkdir '/home/runner12'`. That
      # path is not in the environment — a diagnostic step on the same runner
      # printed HOME, RUNNER_TOOL_CACHE, RUNNER_TEMP and the passwd home all as
      # /var/lib/runners/runner12, which exists. Overriding HOME and
      # RUNNER_TOOL_CACHE on the step changed nothing: both appeared in the
      # step env and it still tried /home/<username>. The action composes that
      # path itself, so there is no variable to set.
      #
      # It had failed every scheduled run since at least 2026-08-24 — five
      # weeks, never once green.
      #
      # `wit-bindgen test` DOES need this binary; it spawns `wasmtime` to run
      # the generated tests, which no step in this file makes visible. An
      # earlier attempt removed the install on that reading and got
      # `Error: runner `wasmtime` failed to spawn`.
      #
      # Pinned rather than `latest`, which the action defaulted to: a corpus
      # regenerated weekly should not also drift its runtime silently.
      - name: Install wasmtime
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/wasmtime"
          mkdir -p "$dest"
          curl -fsSL \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz" \
            | tar -xJ -C "$dest" --strip-components=1
          # Demand the binary rather than trusting the extract: `tool | grep -q`
          # in an `if` passes when the TOOL fails, not only when it is absent,
          # and that shape once reported "statically linked" for a file that did
          # not exist (#432).
          test -x "$dest/wasmtime" || { echo "::error::wasmtime not extracted to $dest"; exit 1; }
          "$dest/wasmtime" --version
          echo "$dest" >> "$GITHUB_PATH"

      - name: Install wit-bindgen CLI
        run: cargo install wit-bindgen-cli@${{ env.WIT_BINDGEN_VERSION }}

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-fixtures-${{ env.WIT_BINDGEN_VERSION }}
          restore-keys: ${{ runner.os }}-fixtures-

      # $RUNNER_TEMP, not /tmp. This job runs on a SELF-HOSTED runner, where
      # /tmp persists between runs — so the second dispatch failed in the clone
      # with the destination already existing. On a GitHub-hosted runner /tmp is
      # fresh each time and this would never have shown up. $RUNNER_TEMP is
      # per-job and cleaned, which also removes any chance of generating
      # fixtures from a stale checkout.
      #
      # The job had never run far enough to reach this, which is what a gate
      # dead for five weeks looks like: each fix uncovers the next layer.
      - name: Clone wit-bindgen
        run: |
          git clone --depth 1 --branch v${{ env.WIT_BINDGEN_VERSION }} \
            https://github.com/bytecodealliance/wit-bindgen "$RUNNER_TEMP/wit-bindgen"

      # Drop the three upstream runtime tests a Rust-only run cannot build.
      # Measured on wit-bindgen 0.63.0, Rust 1.100.0 and wasmtime 49.0.2:
      #   rust/dylibs, rust/dylibs-async: "need a wasi-sdk-path" (they link a
      #     C dylib; this job installs no wasi-sdk);
      #   simple-stream: Rust runners but only C/Go/MoonBit `test` components,
      #     so `--languages rust` fails with "no components found for `test`"
      #     and aborts the whole run before any artifact is composed.
      # (`--skip` drops the components but not the test group, so it hits the
      # same "no components found" error.) With these removed the run exits 0:
      # 185 components compiled, 93 compositions run, 79 composed fixtures.
      #
      # It FAILS if a listed directory is gone, so an upstream reshuffle makes
      # us re-measure instead of leaving a step that silently does nothing
      # (#405, #447).
      #
      # wit-bindgen 0.54.0's harness (the previous pin) passed
      # `-Ldependency=target/<triple>/debug/deps`. Cargo 1.100's build-dir layout
      # has no `deps/` directory (proc-macros land in
      # `debug/build/<pkg>/<hash>/out/`), so every test failed with E0463 for
      # `wit_bindgen_rust_macro` (116 E0463 on runs 43885793906 and 45222672196).
      # 0.63.0 takes the directories from cargo's JSON artifact messages instead.
      # The 0.54 `max_value()` lint patch is gone too: 0.63's tests have none.
      - name: Drop runtime tests a Rust-only run cannot build
        working-directory: ${{ runner.temp }}/wit-bindgen
        run: |
          set -euo pipefail
          for d in tests/runtime/rust/dylibs tests/runtime/rust/dylibs-async tests/runtime/simple-stream; do
            if [ ! -d "$d" ]; then
              echo "::error::$d not found in wit-bindgen ${WIT_BINDGEN_VERSION}; re-measure which tests a Rust-only run can build and update this list"
              exit 1
            fi
            rm -rf "$d"
            echo "dropped $d"
          done

      # `--cap-lints=warn` because this compiles UPSTREAM wit-bindgen's own test
      # sources, which deny warnings. 115 of 116 built; the last aborted on
      # `tests/runtime/numbers/runner.rs` using the deprecated
      # `i64::max_value()`, which a current rustc reports and that crate's
      # deny(warnings) turns into 32 errors.
      #
      # Capping rather than pinning rustc: the failure is not specific to this
      # lint. A weekly job that compiles third-party source under deny(warnings)
      # against `stable` breaks whenever rustc adds or sharpens ANY lint, so a
      # pin would only move the next breakage to the next bump. We are
      # generating FIXTURES here, not vetting upstream's lint hygiene.
      #
      # Note `--cap-lints` is normally a dependency-only tool; it is applied
      # deliberately to the whole invocation, which is what downgrades the
      # crate-level `deny` that a bare `-A deprecated` would lose to.
      #
      # The remaps make the corpus reproducible. Without them the binaries
      # embed the self-hosted runner's own paths (toolchain sources, the
      # cargo registry and the runner temp dir, all under the runner's
      # own home), so two runs on different runners differ in every fixture
      # and each weekly run pushed a byte-noise corpus. They go into a
      # `rustc` wrapper first on PATH, not RUSTFLAGS: `wit-bindgen test`
      # runs `rustc` directly for the test crates (with -Cdebuginfo=1), and
      # those invocations never read RUSTFLAGS. Setting RUSTFLAGS alone left
      # 35 runner paths in a fixture and the corpus still differed per runner.
      - name: Generate test artifacts
        working-directory: ${{ runner.temp }}/wit-bindgen
        env:
          RUSTFLAGS: --cap-lints=warn
        run: |
          real_rustc=$(command -v rustc)
          sysroot=$(rustc --print sysroot)
          cargo_home=${CARGO_HOME:-$HOME/.cargo}
          wrap="$RUNNER_TEMP/rustc-remap"
          mkdir -p "$wrap"
          cat > "$wrap/rustc" <<EOF
          #!/bin/sh
          exec "$real_rustc" "\$@" \\
            --remap-path-prefix="$sysroot=/rust-sysroot" \\
            --remap-path-prefix="$cargo_home=/cargo-home" \\
            --remap-path-prefix="$RUNNER_TEMP=/build"
          EOF
          chmod +x "$wrap/rustc"
          export PATH="$wrap:$PATH"
          wit-bindgen test --languages rust --artifacts artifacts tests/runtime
          # Fail here, not in review, if a runner path survived.
          if grep -rlaF "$HOME" artifacts --include='composed-*.wasm' | head -1 | grep -q .; then
            echo "::error::a generated fixture still embeds the runner home $HOME"
            exit 1
          fi

      - name: Copy fixtures
        run: |
          # Copy all composed artifacts from wit-bindgen
          for dir in "$RUNNER_TEMP"/wit-bindgen/artifacts/*/; do
            test=$(basename "$dir")
            src=$(find "$dir" -name 'composed-*.wasm' -print -quit 2>/dev/null)
            dst="tests/wit_bindgen/fixtures/${test}.wasm"
            if [ -n "$src" ] && [ -f "$src" ]; then
              cp "$src" "$dst"
              echo "Copied ${test}.wasm (from $(basename "$src"))"
            fi
          done

      - name: Check for changes
        id: diff
        run: |
          # Force-add ignores .gitignore rules so the wasm files show up in diff.
          # The glob must be recursive: `fixtures/*.wasm` never matches a
          # subdirectory, which is how the eleven `release-0.2.0/` components
          # stayed untracked while 57 siblings were added, leaving 18 tests
          # passing in CI without executing anything (#405, SR-85).
          # `--force` overrides .gitignore, including a fixture's own `target/`
          # rule, so exclude build trees explicitly or the weekly job sweeps
          # compiler output into the repository alongside the fixtures.
          git add --force 'tests/wit_bindgen/fixtures/**/*.wasm' \
            tests/wit_bindgen/fixtures/*.wasm \
            ':(exclude)tests/wit_bindgen/fixtures/**/target/**'
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes the branch, then opens a PR for it if one is not already open.
      #
      # History, because the shape of this step is otherwise puzzling. It used
      # `peter-evans/create-pull-request`, which pushed the branch and then
      # failed with `GitHub Actions is not permitted to create or approve pull
      # requests`. That is NOT a repository setting a workflow can reach: the
      # job already declares `pull-requests: write`, and a repo-level
      # `PUT /repos/{o}/{r}/actions/permissions/workflow` returns **409
      # Conflict** while the ORGANISATION forbids it. The org policy has since
      # been changed, so `GITHUB_TOKEN` can open PRs here again.
      #
      # The commit is built through the git data API rather than handed back
      # to the action or pushed with git: GitHub signs API commits, which
      # main requires, and if PR creation is refused the corpus still lands
      # on a branch with a compare link in the summary.
      #
      # `curl` rather than `gh`: the CLI is not installed on every self-hosted
      # label in this fleet (mythos-auto.yml records hitting exit 127 on the
      # `light` runner), while curl and jq are.
      - name: Push the refreshed corpus and open a PR
        if: steps.diff.outputs.changed == 'true'
        env:
          BRANCH: ci/update-wit-bindgen-fixtures
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          gh_api() {
            # gh_api METHOD PATH [BODY_FILE]: one authenticated REST call.
            local method=$1 path=$2
            if [ $# -ge 3 ]; then
              curl -fsS -X "$method" -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                --data-binary @"$3" "$api/$path"
            else
              curl -fsS -X "$method" -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" "$api/$path"
            fi
          }
          # main requires signed commits and a `git push` from the runner is
          # unsigned, so every corpus PR used to sit BLOCKED until a
          # maintainer re-signed it. A commit created through the git data
          # API with GITHUB_TOKEN is signed by GitHub, so build it there:
          # one blob per changed fixture, a tree on top of main's, a commit,
          # then point the branch at it. The diff step has already
          # force-added the fixture paths, so the index lists them.
          base=$(git rev-parse HEAD)
          base_tree=$(git rev-parse 'HEAD^{tree}')
          tmp=$(mktemp -d)
          entries="$tmp/entries.jsonl"
          : > "$entries"
          while IFS= read -r path; do
            { printf '{"encoding":"base64","content":"'
              base64 -w0 "$path"
              printf '"}'; } > "$tmp/blob.json"
            sha=$(gh_api POST git/blobs "$tmp/blob.json" | jq -r .sha)
            jq -nc --arg p "$path" --arg s "$sha" \
              '{path:$p, mode:"100644", type:"blob", sha:$s}' >> "$entries"
          done < <(git diff --cached --name-only --diff-filter=AM)
          jq -s --arg b "$base_tree" '{base_tree:$b, tree:.}' "$entries" > "$tmp/tree.json"
          tree=$(gh_api POST git/trees "$tmp/tree.json" | jq -r .sha)
          jq -n --arg m "fix(tests): update wit-bindgen fixtures to v${WIT_BINDGEN_VERSION}" \
                --arg t "$tree" --arg p "$base" \
                '{message:$m, tree:$t, parents:[$p]}' > "$tmp/commit.json"
          commit=$(gh_api POST git/commits "$tmp/commit.json" | jq -r .sha)
          verified=$(gh_api GET "git/commits/$commit" | jq -r '.verification.verified')
          echo "corpus commit $commit, GitHub signature verified: $verified"
          # The branch belongs to this job: each run regenerates the whole
          # corpus from main, so it replaces whatever the branch held.
          if gh_api GET "git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            jq -n --arg s "$commit" '{sha:$s, force:true}' > "$tmp/ref.json"
            gh_api PATCH "git/refs/heads/$BRANCH" "$tmp/ref.json" >/dev/null
          else
            jq -n --arg r "refs/heads/$BRANCH" --arg s "$commit" '{ref:$r, sha:$s}' > "$tmp/ref.json"
            gh_api POST git/refs "$tmp/ref.json" >/dev/null
          fi
          # Open a PR only when one is not already open for this branch, so a
          # weekly re-push updates the existing PR instead of erroring or
          # opening duplicates.
          open_count=$(gh_api GET "pulls?state=open&head=${GITHUB_REPOSITORY%%/*}:$BRANCH" | jq 'length')
          pr_url=""
          # The org forbids Actions from creating PRs, so the POST below
          # returns 403. Under pipefail a bare curl -f would end the step
          # there, before the summary prints the compare link a maintainer
          # opens the PR from. Treat a failed POST as "no URL".
          if [ "${open_count:-0}" -eq 0 ]; then
            body=$(printf 'Automated refresh of the wit-bindgen fixture corpus against pinned `wit-bindgen v%s`.\n\nGenerated by `.github/workflows/fixtures.yml`. The corpus is opaque `.wasm`, so the review that matters is the test suite: `wit_bindgen_runtime` fuses these components and executes the results, so a fixture that has gone semantically wrong fails rather than merely changing size.\n' "$WIT_BINDGEN_VERSION")
            pr_url=$(jq -n --arg t "Update wit-bindgen test fixtures to v${WIT_BINDGEN_VERSION}" \
                            --arg h "$BRANCH" --arg b "$body" \
                            '{title:$t, head:$h, base:"main", body:$b}' \
              | curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -d @- "$api/pulls" | jq -r '.html_url // empty') || pr_url=""
          fi
          {
            printf '### wit-bindgen fixtures refreshed\n\n'
            printf 'Pushed `%s` against pinned wit-bindgen `v%s`.\n\n' "$BRANCH" "$WIT_BINDGEN_VERSION"
            if [ -n "$pr_url" ]; then
              printf '**Pull request:** %s\n' "$pr_url"
            elif [ "${open_count:-0}" -gt 0 ]; then
              printf 'An open pull request for `%s` already exists; it now carries this push.\n' "$BRANCH"
            else
              printf 'PR creation did not return a URL. Open one here: https://github.com/%s/compare/main...%s?expand=1\n' "$GITHUB_REPOSITORY" "$BRANCH"
            fi
            printf '\nCommit `%s`, created through the git data API; GitHub signature verified: `%s`.\n' "$commit" "$verified"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Say so when nothing drifted
        if: steps.diff.outputs.changed != 'true'
        run: echo "::notice::the fixture corpus already matches wit-bindgen v${WIT_BINDGEN_VERSION} — nothing to push"
