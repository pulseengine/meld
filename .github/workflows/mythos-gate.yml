name: Mythos delta-pass gate

# Blocks merge of PRs that touch Tier-5 source files until the current
# head commit has a complete Mythos delta-pass with no findings, or a
# maintainer override.
#
# Why this exists: LS-A-10 (CABI alignment padding in async-lift retptr
# writeback) was found by the v0.8.0 pre-release Mythos pass on
# `adapter/fact.rs` — but it had silently lived in the callback emitter
# since #128 (~6 releases). A PR-time gate would have caught it then
# instead of at release time.
#
# The pass itself runs in mythos-auto.yml, which records its verdict as
# commit status `mythos/auto-verdict` on the head commit and re-runs this
# job. The gate passes when that status is success (every touched Tier-5
# file reviewed, NO FINDINGS), or when `mythos-pass-done` is applied: the
# override for a finding or an incomplete run a maintainer has judged.
# A push removes the label. Until #595 the label was the only way through,
# was not tied to a commit, and a cancelled run could post "NO FINDINGS
# across 0 files" for a maintainer to sign off on.
#
# The decision is scripts/ci/mythos_decide.py (`gate`), read from the
# base commit and tested by its --self-test in Script portability.
#
# Tier-5 set tracks scripts/mythos/rank.md. Path globs encode the
# rubric's "5 (fusion correctness)" tier in concrete repo paths. Drift
# review: if a Tier-5 file is added that isn't listed here, the gate
# silently lets it through — review the path list whenever rank.md
# changes.

concurrency:
  group: mythos-gate-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  # Removing a stale `mythos-pass-done` on push goes through the issues API.
  issues: write
  # Reads commit status `mythos/auto-verdict`, written by mythos-auto.yml.
  statuses: read

jobs:
  gate:
    name: Mythos delta-pass gate
    # Routes fork PRs to GitHub-hosted runners by default. This is NOT a security
    # boundary: a fork PR can edit this file. Isolation is enforced by the org's
    # smithy runner-group policy and fork-PR approval (pulseengine/warte#35).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","light"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect Tier-5 file changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Tier-5 path patterns per scripts/mythos/rank.md — concrete
          # globs that match the current repo layout. Add new patterns
          # here when rank.md grows.
          patterns=(
            "meld-core/src/parser.rs"
            "meld-core/src/merger/"
            "meld-core/src/resolver.rs"
            "meld-core/src/rewriter.rs"
            "meld-core/src/component_wrap.rs"
            "meld-core/src/p3_async.rs"
            "meld-core/src/p3_stream.rs"
            "meld-core/src/p3_bridge.rs"
            "meld-core/src/adapter/"
            "meld-core/src/resource_graph.rs"
            "meld-core/src/segments.rs"
          )

          # Diff base...head to find changed files in this PR.
          changed=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")

          touched=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            for p in "${patterns[@]}"; do
              case "$f" in
                $p*) touched+=("$f"); break;;
              esac
            done
          done <<< "$changed"

          if [ ${#touched[@]} -eq 0 ]; then
            echo "tier5_touched=false" >> "$GITHUB_OUTPUT"
            echo "No Tier-5 files touched — gate passes by default."
            exit 0
          fi

          echo "tier5_touched=true" >> "$GITHUB_OUTPUT"
          {
            echo "files<<MYTHOSEOF"
            printf '%s\n' "${touched[@]}"
            echo "MYTHOSEOF"
          } >> "$GITHUB_OUTPUT"
          echo "Tier-5 files touched:"
          printf '  - %s\n' "${touched[@]}"

      # Live state, not the event payload: mythos-auto.yml re-runs this job
      # when it posts a verdict, and a re-run replays the original payload
      # (labels as they were then).
      - name: Decide (auto verdict for this commit, or maintainer override)
        id: decide
        if: steps.detect.outputs.tier5_touched == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ACTION: ${{ github.event.action }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          api="https://api.github.com"
          auth="Authorization: Bearer ${GH_TOKEN}"
          accept="Accept: application/vnd.github+json"

          # The override is per commit: a push clears it, so the label always
          # refers to the code it was given for. Only on the push itself
          # (attempt 1), never on a re-run.
          if [ "$ACTION" = "synchronize" ] && [ "$ATTEMPT" = "1" ]; then
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "$auth" -H "$accept" \
              "${api}/repos/${REPO}/issues/${PR_NUMBER}/labels/mythos-pass-done")
            if [ "$code" = "200" ]; then
              echo "::notice::removed mythos-pass-done: new commits since it was applied"
            fi
          fi

          labels=$(curl -fsS -H "$auth" -H "$accept" \
            "${api}/repos/${REPO}/issues/${PR_NUMBER}/labels?per_page=100" | jq -c '[.[].name]')
          # Statuses come newest first; the first with our context is current.
          status=$(curl -fsS -H "$auth" -H "$accept" \
            "${api}/repos/${REPO}/commits/${HEAD_SHA}/statuses?per_page=100" \
            | jq -r '[.[] | select(.context == "mythos/auto-verdict")][0].state // ""')
          echo "labels=${labels} mythos/auto-verdict=${status:-none} on ${HEAD_SHA}"

          # The decision script comes from the base commit, so a PR cannot
          # rewrite the rule it is judged by.
          if ! git show "${BASE_SHA}:scripts/ci/mythos_decide.py" > "$RUNNER_TEMP/mythos_decide.py" 2>/dev/null; then
            echo "::error::the PR's base commit has no scripts/ci/mythos_decide.py; update the branch from main"
            exit 1
          fi
          set +e
          out=$(python3 -I "$RUNNER_TEMP/mythos_decide.py" gate --tier5 true --labels "$labels" --status "$status")
          rc=$?
          set -e
          echo "$out"
          {
            echo "pass=$([ $rc -eq 0 ] && echo true || echo false)"
            echo "reason=$(printf '%s\n' "$out" | sed -n 2p)"
          } >> "$GITHUB_OUTPUT"

      - name: Post / refresh sticky comment
        if: steps.detect.outputs.tier5_touched == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          header: mythos-gate
          message: |
            ## Mythos delta-pass gate

            This PR modifies Tier-5 source files (per
            [`scripts/mythos/rank.md`](../blob/main/scripts/mythos/rank.md)):

            ```
            ${{ steps.detect.outputs.files }}
            ```

            **Status:** ${{ steps.decide.outputs.pass == 'true' && '✅' || '⏳/❌' }} ${{ steps.decide.outputs.reason }}

            How the gate passes, for the current head commit only:
            1. **Automatically**, when `mythos-auto` reviewed every touched
               Tier-5 file at this commit and found nothing (commit status
               `mythos/auto-verdict` = success). No label needed.
            2. **By override**, when a maintainer has read a finding or an
               incomplete run and applies `mythos-pass-done`. A new push
               removes the label, so it always refers to the code it was
               given for.

            **Why this gate exists:** [LS-A-10](../blob/main/safety/stpa/loss-scenarios.yaml)
            (CABI alignment padding in async-lift retptr writeback) lived in
            the callback emitter from #128 for six releases before the v0.8.0
            pre-release Mythos pass found it.

      - name: Fail unless the auto verdict or the override clears this commit
        if: >-
          steps.detect.outputs.tier5_touched == 'true' &&
          steps.decide.outputs.pass != 'true'
        env:
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          echo "::error::Mythos delta-pass gate: ${REASON}"
          exit 1
