name: Fuzz Smoke

# 60-second-per-target smoke run. Catches regressions that crash a fuzz
# target within the first minute. NOT a substitute for an overnight or
# CI-fleet fuzz campaign — dedicated long-running infrastructure (e.g.
# OSS-Fuzz, ClusterFuzzLite) is the right home for that.
#
# This job is currently informational (continue-on-error: true) because
# cargo-fuzz requires nightly Rust and the project does not yet pin a
# nightly version into its standard matrix. Once nightly is wired in,
# flip continue-on-error to false to make the smoke gate enforcing.
#
# Security note: every `run:` step below uses values that come exclusively
# from the workflow file itself (the matrix is hardcoded). No untrusted
# event payloads (issue/PR titles, commit messages, branch refs from
# forks, etc.) are interpolated into shell commands. If you add steps
# that consume `github.event.*` data, route it through `env:` first.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  # Not on push to main: each change already ran this on its PR, and the
  # main re-run only queued on the shared rust-cpu pool (measured ~100 min
  # queue per main push, 2026-10). A nightly run still covers main itself.
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'safety/**'
      - 'scripts/mythos/**'
      - 'tools/*.py'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Layer 1 defense against #168: cargo-fuzz injects
  # `-Z sanitizer=address`, which is incompatible with statically-
  # linked libc. Drifted smithy runners may have
  # `target-feature=+crt-static` cached in /etc/cargo/config.toml.
  # Setting RUSTFLAGS at the workflow level completely overrides any
  # cargo-config rustflags (cargo gives env-RUSTFLAGS strict
  # precedence). Harmless no-op on clean runners.
  RUSTFLAGS: "-C target-feature=-crt-static"
  # Layer 2 defense against #168 (observed on PR #188 follow-up
  # rerun): once RUSTFLAGS-disabled crt-static gets past rustc,
  # libfuzzer-sys's build.rs reads the runner's *default build
  # target* — drifted runners have
  # `[build] target = "x86_64-unknown-linux-musl"` in their cargo
  # config, so the C++ helper tries to invoke
  # `x86_64-linux-musl-g++`, which isn't on the runner's PATH, and
  # the build fails with "ToolNotFound". CARGO_BUILD_TARGET set at
  # the workflow env level overrides that config-derived default;
  # cargo-fuzz inherits this, builds for gnu, and uses the host
  # `g++`. Harmless no-op on clean runners (host triple matches).
  CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu

jobs:
  fuzz-smoke:
    # One job runs all four targets in sequence (was a 4-way matrix: four
    # queue slots on the shared rust-cpu pool for ~1.5-9 min of work each).
    # Every target still runs even if an earlier one fails.
    name: Fuzz smoke
    runs-on: [self-hosted, linux, x64, rust-cpu]
    continue-on-error: true
    env:
      FUZZ_TARGETS: fuzz_parse_component fuzz_resolver_terminates fuzz_merger_idempotent fuzz_fusion_roundtrip
    steps:
      - uses: actions/checkout@v4

      # Do NOT install the `x86_64-unknown-linux-musl` toolchain target.
      # musl statically links libc, which is incompatible with the
      # AddressSanitizer that `cargo-fuzz` injects via
      # `-Z sanitizer=address`. The build then fails with
      #   error: sanitizer is incompatible with statically linked libc,
      #          disable it using `-C target-feature=-crt-static`
      # cargo-fuzz's `--release` reuse path can pick up a musl target if
      # a stale `fuzz/target/` is restored from cache. We default to the
      # host gnu target (no `targets:` line, no `--target` flag on
      # `cargo fuzz run`) so the sanitizer stays compatible.
      # Inputs here are workflow-static (no untrusted event payloads):
      # `FUZZ_TARGETS` is hardcoded in the job env and
      # `runner.os` is GitHub-provided runner metadata.
      # See pulseengine/meld#168 for the recurring failure pattern.
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Cache fuzz target build
        uses: actions/cache@v4
        with:
          path: |
            fuzz/target/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          # Cache key version-bumped to `v2-` once to bust any snapshots
          # taken while the toolchain still had musl as an extra target
          # (#168). Bump again if a future change should invalidate all
          # existing caches in lock-step.
          key: ${{ runner.os }}-fuzz-v3-${{ hashFiles('fuzz/Cargo.toml', 'meld-core/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-fuzz-v3-

      # Layer 3 defense against #168 (the layer that actually holds): an
      # EXPLICIT `--target` on `cargo fuzz run`. Layer 2 (`CARGO_BUILD_TARGET`
      # env) is insufficient because cargo-fuzz DERIVES its own target from the
      # runner's cargo config (`[build] target = "x86_64-unknown-linux-musl"` on
      # drifted runners) and passes it as an explicit `--target`, which takes
      # strict precedence over the env var. The result: `libfuzzer-sys`'s
      # build.rs sees `TARGET=...musl`, the `cc` crate looks for
      # `x86_64-linux-musl-g++` (not installed) and fails with "ToolNotFound" —
      # observed intermittently on PRs #290/#292 despite Layers 1+2. Passing
      # `--target` here occupies the SAME (highest) precedence slot cargo-fuzz
      # uses, forcing the host gnu target on every runner: no musl std, no
      # cross-compiler, sanitizer stays compatible. Harmless on clean runners
      # (gnu IS the native host triple). See pulseengine/meld#168.
      - name: Run each target for 60 s
        run: |
          failed=""
          for t in $FUZZ_TARGETS; do
            echo "::group::$t"
            cargo +nightly fuzz run --release --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=60 \
              || failed="$failed $t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::fuzz targets failed:$failed"
            exit 1
          fi

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
