name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    # Skip CI on docs/safety-only changes — they don't affect code
    # behavior. Reduces meld's draw on the shared smithy rust-cpu
    # fleet. Conservative exclusion: anything that could affect
    # cargo build/test/clippy/fmt outputs (.rs, Cargo.{toml,lock},
    # workflows themselves) still triggers.
    paths-ignore:
      - '**/*.md'
      - 'safety/**'
      - 'scripts/mythos/**'
      - 'tools/*.py'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'safety/**'
      - 'scripts/mythos/**'
      - 'tools/*.py'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test --all

  coverage:
    name: Coverage
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cov-

      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

  clippy:
    name: Clippy
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: clippy

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      # #408: the optional `attestation` feature was linted by NOTHING. The
      # clippy job above runs without it, release.yml builds without it, and
      # the only job that compiled it at all was coverage. Turning it on here
      # immediately failed — `profile_label` and `attestation_parameters` were
      # dead code with the feature on — which is the kind of thing a lint is
      # for and nobody had been in a position to see.
      #
      # A separate invocation rather than adding --all-features above, because
      # the two configurations are genuinely different code and both should be
      # clean; folding them into one run would hide whichever passed.
      - name: Run clippy (--all-features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: [self-hosted, linux, x64, light]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
