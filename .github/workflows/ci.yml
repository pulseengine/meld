name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    # Skip CI on docs/safety-only changes — they don't affect code
    # behavior. Reduces meld's draw on the shared smithy rust-cpu
    # fleet. Conservative exclusion: anything that could affect
    # cargo build/test/clippy/fmt outputs (.rs, Cargo.{toml,lock},
    # workflows themselves) still triggers.
    paths-ignore:
      - '**/*.md'
      - 'safety/**'
      - 'scripts/mythos/**'
      - 'tools/*.py'
  # NO `paths-ignore` on pull_request: Test/Clippy/Format are required, and
  # a workflow that does not start reports nothing. The `changes` job applies
  # the same globs (scripts/ci/classify_changes.py DOCS_ONLY, kept equal to the
  # push filter above by scripts/check_workflow_gates.py) and the jobs skip by
  # job-level `if:` instead. This replaced ci-docs-stub.yml.
  pull_request:
    branches: [main]
  # GitHub merge queue: this workflow emits a required context, so it must run
  # on merge_group or a queued PR waits on a check nothing reports.
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    # Path classification moved here from the `pull_request` filter
    # (scripts/ci/classify_changes.py, fails closed), replacing the stub
    # workflow that posted trivially-green duplicates of the required contexts.
    # Gated jobs skip by job-level `if:`, which still reports the context, and
    # use `!cancelled()` so a FAILED classifier runs them instead.
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.c.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classifier can still discriminate
        run: python3 scripts/ci/classify_changes.py --self-test
      - id: c
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python3 scripts/ci/classify_changes.py

  test:
    name: Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test --all

  coverage:
    name: Coverage
    # Advisory (not required): skipped in the merge queue.
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'merge_group' && needs.changes.outputs.docs_only != 'true' }}
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cov-

      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

  clippy:
    name: Clippy
    # PR-only: every change reaches main through a PR that ran Clippy on the
    # same tree. Re-running it on the main push only occupied a shared
    # rust-cpu runner (measured: ~100 min queue per main push, 2026-10).
    # It is required, so it also runs on merge_group: the queue commit is
    # what lands, and is not a tree any PR ran Clippy on.
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.docs_only != 'true' }}
    runs-on: [self-hosted, linux, x64, rust-cpu]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: clippy

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      # #408: the optional `attestation` feature was linted by NOTHING. The
      # clippy job above runs without it, release.yml builds without it, and
      # the only job that compiled it at all was coverage. Turning it on here
      # immediately failed — `profile_label` and `attestation_parameters` were
      # dead code with the feature on — which is the kind of thing a lint is
      # for and nobody had been in a position to see.
      #
      # A separate invocation rather than adding --all-features above, because
      # the two configurations are genuinely different code and both should be
      # clean; folding them into one run would hide whichever passed.
      - name: Run clippy (--all-features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: [self-hosted, linux, x64, light]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
