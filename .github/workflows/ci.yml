name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    # Skip CI on docs/safety-only changes — they don't affect code
    # behavior. Reduces meld's draw on the shared smithy rust-cpu
    # fleet. Conservative exclusion: anything that could affect
    # cargo build/test/clippy/fmt outputs (.rs, Cargo.{toml,lock},
    # workflows themselves) still triggers.
    paths-ignore:
      - '**/*.md'
      # meld-cli/docs/*.md is compiled into the binary (include_str!) and the
      # SR-82 claim checks in Test read it, so it is NOT docs-only.
      - '!meld-cli/docs/**'
      # By file type, not by directory: a fixture or test input dropped under
      # safety/ must still run the real CI (cf. spar#384-A). scripts/mythos/
      # holds only .md, which the first pattern already covers.
      - 'safety/**/*.yaml'
      - 'safety/**/*.json'
      - 'tools/*.py'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      # meld-cli/docs/*.md is compiled into the binary (include_str!) and the
      # SR-82 claim checks in Test read it, so it is NOT docs-only.
      - '!meld-cli/docs/**'
      # By file type, not by directory: a fixture or test input dropped under
      # safety/ must still run the real CI (cf. spar#384-A). scripts/mythos/
      # holds only .md, which the first pattern already covers.
      - 'safety/**/*.yaml'
      - 'safety/**/*.json'
      - 'tools/*.py'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    # Routes fork PRs to GitHub-hosted runners by default. This is NOT a security
    # boundary: a fork PR can edit this file. Isolation is enforced by the org's
    # smithy runner-group policy and fork-PR approval (pulseengine/warte#35).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, toolchain pinned
        with:
          toolchain: 1.100.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --locked --all-targets

      - name: Run tests
        run: cargo test --locked --all

      # Lockfile sweep (2026-11-20): every Cargo.lock in the tree is tracked,
      # none is gitignored, and each one matches its manifest. cargo has no
      # global locked switch, so this checks every committed lock directly,
      # including the ones no job here builds (fuzz, tools, test fixtures).
      # An out-of-date lock fails here instead of being rewritten silently.
      - name: Every Cargo.lock is tracked and current
        run: |
          set -euo pipefail
          fail=0
          for m in $(git ls-files '*Cargo.toml'); do
            lock="$(dirname "$m")/Cargo.lock"
            if git check-ignore --no-index -q "$lock"; then
              echo "::error::$lock is gitignored; commit it"; fail=1
            fi
          done
          locks=$(git ls-files '*Cargo.lock')
          [ -n "$locks" ] || { echo "::error::no tracked Cargo.lock found"; exit 1; }
          for lock in $locks; do
            if ! cargo metadata --locked --format-version 1 \
                 --manifest-path "$(dirname "$lock")/Cargo.toml" >/dev/null; then
              echo "::error::$lock is out of date with its Cargo.toml"; fail=1
            fi
          done
          echo "checked $(echo "$locks" | wc -l | tr -d ' ') lockfiles"
          exit "$fail"

  coverage:
    name: Coverage
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, toolchain pinned
        with:
          toolchain: 1.100.0

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cov-

      # Coverage reads llvm-cov's own mapping sections, not DWARF. With the dev
      # profile's `debug = true`, each of the ~100 instrumented integration-test
      # binaries carried full debug info (~0.4 GB each on Linux, ~40 GB per job),
      # which nearly filled the shared runner volume (smithy#296).
      - name: Generate coverage
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov.info
          fail_ci_if_error: false

      # Self-hosted runners keep the workspace between jobs. Remove the
      # workspace's instrumented artifacts (the test binaries); dependency
      # builds stay for the next run. Runs on failure and cancellation too.
      - name: Remove instrumented test binaries
        if: always()
        run: |
          du -sh target 2>/dev/null || true
          cargo llvm-cov clean --workspace
          du -sh target 2>/dev/null || true

  # Run what we build: meld as a wasip2 component. meld.wasm fuses fixtures
  # (and itself) under wasmtime, and every output must equal native meld's
  # output byte for byte under --reproducible. A word-size-dependent byte
  # (the provenance sentinel id, fixed with this job) fails it. A planted
  # control proves the comparison can fail, and exit codes must match native.
  wasm-component:
    name: meld.wasm component
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, toolchain pinned
        with:
          toolchain: 1.100.0
          targets: wasm32-wasip2

      - name: Install wasmtime
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: wasmtime@41.0.0

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Build meld natively and as a wasip2 component
        run: |
          cargo build --locked --release -p meld-cli
          cargo build --locked --release -p meld-cli --target wasm32-wasip2

      - name: meld.wasm output equals native output
        run: |
          set -euo pipefail
          native=target/release/meld
          wasm=target/wasm32-wasip2/release/meld.wasm
          run_wasm() { wasmtime run -S cli-exit-with-code=y --dir "$work::/w" "$wasm" "$@"; }
          work=$(mktemp -d)
          cp "$wasm" "$work/meld.wasm"
          inputs="meld.wasm"
          for f in records flavorful lists resource_alias numbers; do
            cp "tests/wit_bindgen/fixtures/$f.wasm" "$work/"
            inputs="$inputs $f.wasm"
          done
          n=0
          for f in $inputs; do
            run_wasm fuse --reproducible "/w/$f" -o "/w/$f.from-wasm" >/dev/null
            "$native" fuse --reproducible "$work/$f" -o "$work/$f.from-native" >/dev/null
            [ -s "$work/$f.from-native" ] || { echo "::error::native produced no output for $f"; exit 1; }
            if ! cmp "$work/$f.from-wasm" "$work/$f.from-native"; then
              echo "::error::meld.wasm and native meld disagree on $f"; exit 1
            fi
            n=$((n + 1))
          done
          # Planted controls: the comparison above must be able to fail.
          # (1) outputs of two different inputs compare unequal;
          # (2) one flipped byte in a copy of a matched output compares unequal.
          if cmp -s "$work/records.wasm.from-wasm" "$work/flavorful.wasm.from-native"; then
            echo "::error::control: outputs of different inputs compare equal"; exit 1
          fi
          cp "$work/records.wasm.from-wasm" "$work/tampered"
          byte=$(od -An -tu1 -j 100 -N 1 "$work/tampered" | tr -d ' ')
          printf "\\$(printf '%03o' $(( (byte + 1) % 256 )))" \
            | dd of="$work/tampered" bs=1 seek=100 conv=notrunc 2>/dev/null
          if cmp -s "$work/tampered" "$work/records.wasm.from-native"; then
            echo "::error::control: a flipped byte went undetected"; exit 1
          fi
          echo "meld.wasm matched native on $n inputs; control differed"

      - name: meld.wasm exit codes equal native
        run: |
          set -euo pipefail
          native=target/release/meld
          wasm=target/wasm32-wasip2/release/meld.wasm
          check() {
            want=$1; shift
            rn=0; "$native" "$@" >/dev/null 2>&1 || rn=$?
            rw=0; wasmtime run -S cli-exit-with-code=y "$wasm" "$@" >/dev/null 2>&1 || rw=$?
            echo "meld $*: native=$rn wasm=$rw want=$want"
            [ "$rn" = "$want" ] && [ "$rw" = "$want" ]
          }
          check 0 --version
          check 2 --no-such-flag
          check 1 fuse /no/such/input.wasm -o /no/such/out.wasm

      - name: Upload meld.wasm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meld-wasm32-wasip2
          path: target/wasm32-wasip2/release/meld.wasm
          if-no-files-found: error

  clippy:
    name: Clippy
    # PR-only: every change reaches main through a PR that ran Clippy on the
    # same tree. Re-running it on the main push only occupied a shared
    # rust-cpu runner (measured: ~100 min queue per main push, 2026-10).
    if: github.event_name == 'pull_request'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","rust-cpu"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, toolchain pinned
        with:
          toolchain: 1.100.0
          components: clippy

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # #408: the optional `attestation` feature was linted by NOTHING. The
      # clippy job above runs without it, release.yml builds without it, and
      # the only job that compiled it at all was coverage. Turning it on here
      # immediately failed — `profile_label` and `attestation_parameters` were
      # dead code with the feature on — which is the kind of thing a lint is
      # for and nobody had been in a position to see.
      #
      # A separate invocation rather than adding --all-features above, because
      # the two configurations are genuinely different code and both should be
      # clean; folding them into one run would hide whichever passed.
      - name: Run clippy (--all-features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # #709: `attestation` is now a default feature, so neither run above
      # compiles meld's own attestation schema, which a meld-core build
      # without default features still writes. Lint that configuration too.
      - name: Run clippy (meld-core, --no-default-features)
        run: cargo clippy --locked -p meld-core --all-targets --no-default-features -- -D warnings

  fmt:
    name: Format
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","light"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, toolchain pinned
        with:
          toolchain: 1.100.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      # No fork PR reaches a self-hosted runner. Every self-hosted runs-on uses
      # the fail-closed same-repo form, so a fork, or a deleted fork whose
      # head.repo is null, falls to the hosted runner. No self-hosted job sits
      # under a trigger a fork can cause (pull_request_target, workflow_run, ...).
      # The checker is copied from pulseengine/relay. Its unit tests run first,
      # then a planted plain self-hosted job must fail it, then the real tree
      # must pass.
      - name: Self-hosted fork guard (fail-closed runs-on)
        run: |
          rustc --edition 2021 --test scripts/check-selfhosted-fork-guard.rs -o "$RUNNER_TEMP/csfg-test"
          "$RUNNER_TEMP/csfg-test"
          rustc --edition 2021 -O scripts/check-selfhosted-fork-guard.rs -o "$RUNNER_TEMP/csfg"
          plant="$RUNNER_TEMP/csfg-plant"
          rm -rf "$plant" && mkdir -p "$plant/.github"
          cp -r .github/workflows "$plant/.github/"
          printf '  planted:\n    runs-on: [self-hosted, linux, x64, light]\n    steps:\n      - run: true\n' \
            >> "$plant/.github/workflows/gate-probe.yml"
          rc=0
          (cd "$plant" && "$RUNNER_TEMP/csfg") || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::negative control: a planted plain self-hosted job must fail the guard (exit 1), got $rc"
            exit 1
          fi
          "$RUNNER_TEMP/csfg"
