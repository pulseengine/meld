name: LS-N verification gate

# Verifies that every approved loss-scenario in
# `safety/stpa/loss-scenarios.yaml` has a passing regression test by
# naming convention (`LS-A-11` -> `ls_a_11_*`). Posts a single sticky PR
# comment summarising passed / failed / missing counts. Fails the job
# only when an existing test fails; missing tests are reported as a
# warning (advisory) so older approved scenarios with ad-hoc test names
# can be migrated incrementally rather than blocking every PR.
#
# Adapted from spar's rivet-driven verification gate
# (pulseengine/spar@ba329f3d). meld has no rivet-style executable
# artifact, but `status: approved` LS entries pair with regression tests
# by the established `ls_<letter>_<num>_*` naming convention; this gate
# makes that pairing a verifiable contract.
#
# Inputs are all integer/metadata fields (PR number, head_ref); no
# untrusted free-form text from PR titles/bodies/comments is read in
# `run:` blocks, so the standard injection vectors do not apply.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: LS-N verification gate
    # Routes fork PRs to GitHub-hosted runners by default. This is NOT a security
    # boundary: a fork PR can edit this file. Isolation is enforced by the org's
    # smithy runner-group policy and fork-PR approval (pulseengine/warte#35).
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","rust-cpu"]') }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Only gen-verification-matrix.py still needs it (traceability.yaml is not
      # a rivet artifact file; rivet#1094).
      - name: Install PyYAML
        # Self-hosted runners ship Debian/Ubuntu Python with PEP 668
        # protection; `--break-system-packages` is the documented opt-out
        # for CI environments where the runner's Python install is
        # disposable per workflow run.
        run: pip install --user --break-system-packages pyyaml

      # meld#500: gen-verification-matrix.py (titles) and run_ls_verification.py
      # (approved LS ids) read artifacts through `rivet list --format json`. Same pin and install shape as
      # traceability.yml (0.40.0 is the version `list --format json` was
      # verified against).
      - name: Install rivet
        env:
          RIVET_VERSION: "0.40.0"
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/rivet"
          mkdir -p "$dest"
          curl -fsSL \
            "https://github.com/pulseengine/rivet/releases/download/v${RIVET_VERSION}/rivet-v${RIVET_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$dest"
          bin=$(find "$dest" -type f -name rivet -perm -u+x | head -1)
          test -n "$bin" || { echo "::error::no rivet binary in the tarball"; exit 1; }
          "$bin" --version
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"

      # #411: four cited tests did not exist, three of them naming behaviour the
      # code had since deliberately inverted. A citation that resolves to nothing
      # is mechanically catchable; this is that check. Fails the gate.
      - name: Cited tests must exist
        run: python3 tools/check_record_citations.py

      # What a release ships is decided by two independent lists — the build
      # matrix and the assets gate's required set — kept in sync by a comment
      # asking a human to remember. The gate only runs after publication, so a
      # target that quietly stops being built is either invisible (built, not
      # required) or discovered in public (required, not built). Checked here,
      # on the pull request, where drift is still free to fix. Added with the
      # musl assets (#432), which is what made it two lists worth drifting.
      - name: Release matrix and assets gate agree
        run: python3 tools/check_release_targets.py

      # The proof gate's own checks live inside `run: |` block scalars, and a
      # block ends at the first line indented LESS than its content — even a
      # COMMENT. One under-indented line therefore drops every check below it.
      # That happened while building the gate (#447): a comment ended the
      # census step just above its four floor assertions. There the leftover
      # shell did not parse as YAML, so GitHub rejected the file and it was
      # loud; de-indent where the remainder still parses and the step runs a
      # shorter script and passes, with a floor or the Admitted check simply
      # gone. A vacuous gate made by whitespace. Asserted here, against the
      # extracted block text rather than the raw file, because the indentation
      # rule is what produces the truncation and grep cannot see it.
      - name: Proof gate's own checks are intact
        run: python3 scripts/check_workflow_gates.py

      # docs/verification-matrix.md is generated from traceability.yaml. It had
      # drifted from its own source (statuses and test lists), so the published
      # matrix disagreed with the record it renders.
      # #433 / SR-87: the advisory state of what meld SHIPS. Scoped by
      # deny.toml's `exclude-dev`, so this is about the artifact a consumer
      # runs, not about the test harness — see that file for why, and for what
      # it deliberately does not cover.
      #
      # Runs on the pull request because an advisory that lands between
      # releases should be assessed then, not discovered by the release job
      # when someone is trying to cut a tag. The release's VEX generator
      # refuses to default a judgement, so an unassessed advisory blocks a
      # release either way; this makes it block earlier and more cheaply.
      - name: Shipped dependencies carry no known advisory
        run: |
          cargo install --locked cargo-deny || true
          cargo deny check advisories

      - name: Verification matrix is up to date
        run: |
          python3 scripts/gen-verification-matrix.py
          git diff --exit-code docs/verification-matrix.md \
            || { echo "::error::docs/verification-matrix.md is stale — run scripts/gen-verification-matrix.py and commit"; exit 1; }

      - name: Run LS-N verification
        id: verify
        continue-on-error: true
        run: |
          python3 tools/run_ls_verification.py \
            --results-json verification-results.json

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-results
          path: verification-results.json
          if-no-files-found: warn

      - name: Post sticky PR comment
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 tools/post_verification_comment.py "$PR_NUMBER"

      - name: Fail job if any approved LS-N test failed
        # Exit code 1 from run_ls_verification.py = a regression test
        # for an approved LS entry failed. Exit 2 = missing tests only;
        # treated as advisory. Exit 0 = all approved entries verified.
        if: steps.verify.outcome == 'failure'
        run: |
          # Re-check: outcome == failure can mean exit 1 (real fail) or
          # exit 2 (missing only). Inspect the JSON to decide.
          failed=$(python3 -c "import json; print(json.load(open('verification-results.json'))['failed_count'])")
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed approved LS-N entries have failing regression tests; see PR comment"
            exit 1
          fi
          echo "::warning::Some approved LS-N entries are missing regression tests (advisory only)"
