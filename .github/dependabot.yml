version: 2
# One PR per logical release across all directories: version-locked families
# (wasm-tools, wasmtime) and all github-actions pins in / must not split into
# one PR per directory. (Learned from loom/witness/mcp/relay/rules_wasm_component,
# where one release arrived as 4-8 PRs.)
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: &ref_0
      - dependencies
    groups:
      wasm-tools-family:
        patterns:
          - "wasmparser"
          - "wasm-encoder"
          - "wasmprinter"
          - "wit-component"
          - "wit-parser"
          - "wasm-metadata"
          - "wat"
          - "walrus"
      wasmtime:
        patterns:
          - "wasmtime"
          - "wasmtime-*"
      github-actions-all:
        package-ecosystem: github-actions
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: *ref_0
  - package-ecosystem: cargo
    directory: /meld-cli
    schedule:
      interval: weekly
    labels: *ref_0
  - package-ecosystem: cargo
    directory: /meld-core
    schedule:
      interval: weekly
    labels: *ref_0
  - package-ecosystem: cargo
    directory: /tools/spec-sync
    schedule:
      interval: weekly
    labels: *ref_0
  - package-ecosystem: cargo
    directory: /verification/verus-pilot
    schedule:
      interval: weekly
    labels: *ref_0
