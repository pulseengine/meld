repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Fuzz corpus seeds and the vendored component-model suite (#562,
        # checked against SHA256SUMS) are byte-exact files -- do not touch.
        exclude: ^(fuzz/corpus/|tests/spec/component-model/)
      - id: end-of-file-fixer
        exclude: ^(fuzz/corpus/|tests/spec/component-model/)
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo-fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo-clippy
        entry: cargo +stable clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo-test
        entry: cargo test
        language: system
        types: [rust]
        pass_filenames: false
